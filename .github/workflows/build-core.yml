name: Build and Push the Core Service Image

# The core service image (Dockerfile-core, docs/plan-core.md §4b U2f): viva_core served by
# uvicorn, nothing of the SMS application. Its own workflow because it versions on core's line
# (viva_core/version.py, decision D16), not sms-api's. Dispatched by hand, like the others.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. 0.1.0 -- core's version line). Tags are WRITE-ONCE: an existing tag is refused."
        required: true

jobs:
  standalone:
    # The gate: core boots with the application blocked, and every core test passes. No image
    # is pushed without it.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Run the core tests
        run: uv run python -m pytest tests/core tests/test_deploy_config.py -v

  build-and-push:
    needs: standalone
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for pushing to ghcr.io
    env:
      IMAGE: ghcr.io/vivarium-collective/viva-core
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Refuse to overwrite an existing tag
        # Write-once (decision D11): a rebuild is a NEW tag.
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ inputs.tag }} already exists; images are write-once. Choose a new tag."
            exit 1
          fi

      - name: Build, check that core answers its own health route, and push
        run: |
          docker buildx build --platform=linux/amd64 --load -f Dockerfile-core -t core:check .
          docker run --rm core:check /app/.venv/bin/python -c "$(cat scripts/core_image_check.py)"
          docker buildx build --platform=linux/amd64 --push -f Dockerfile-core -t "${IMAGE}:${{ inputs.tag }}" .
          echo "pushed ${IMAGE}:${{ inputs.tag }}"
