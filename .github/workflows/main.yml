name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

      # The vendored PTools viewer patch (assets/ptools/overrides/) is JavaScript, so
      # neither `make check` (pre-commit/ruff) nor the pytest job exercises it. Uses the
      # node preinstalled on ubuntu-latest -- the tests import only `fs` and `path`, so a
      # setup-node action would add supply-chain surface for no benefit.
      - name: Test vendored ptools overrides (JavaScript)
        run: |
          node --version
          shopt -s nullglob
          tests=(assets/ptools/overrides/test_*.js)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no override tests found -- expected at least one"; exit 1
          fi
          for t in "${tests[@]}"; do
            echo "--- $t"
            node "$t"
          done

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run mypy

      - name: Upload coverage reports to Codecov with GitHub Action on Python 3.11
        uses: codecov/codecov-action@v7
        if: ${{ matrix.python-version == '3.11' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run sphinx-build -b html docs/source docs/_build/html
