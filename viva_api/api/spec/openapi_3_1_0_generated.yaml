openapi: 3.1.0
info:
  title: sms-api
  version: 0.9.138
paths:
  /api/v1/simulations/discovery:
    get:
      tags:
      - Simulations
      summary: Discover available config files and analysis modules for a simulator
      description: Enumerate config filenames and analysis modules available in the
        simulator's repo.
      operationId: discover-simulator-repo-contents
      parameters:
      - name: simulator_id
        in: query
        required: true
        schema:
          type: integer
          description: database_id of the simulator to introspect
          title: Simulator Id
        description: database_id of the simulator to introspect
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDiscovery'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/workspace:
    get:
      tags:
      - Simulations
      summary: Export a simulator's repo@commit workspace as a gzipped tarball
      description: 'Stream the simulator''s repo@commit as a gzipped tarball (GitHub
        tarball).


        The repo@commit is the dashboard-loadable workspace; streamed so a large

        repo never buffers in memory or on the pod''s ephemeral disk.'
      operationId: export-simulator-workspace
      parameters:
      - name: simulator_id
        in: query
        required: true
        schema:
          type: integer
          description: database_id of the simulator to export
          title: Simulator Id
        description: database_id of the simulator to export
      responses:
        '200':
          description: A gzipped tarball of the simulator's repo at its commit
          content:
            application/json:
              schema: {}
            application/gzip: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/tags:
    get:
      tags:
      - Simulations
      summary: List the tags present in the database and their experiment IDs
      description: 'Return every tag carried by a simulation, mapped to the experiment
        IDs that carry it.


        Tags are free-form data on each simulation (set at run time or via

        POST /simulations/{id}/tags), so this reflects the actual database contents

        rather than a predefined registry.'
      operationId: list-simulation-tags
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
                title: Response List-Simulation-Tags
  /api/v1/simulations:
    post:
      tags:
      - Simulations
      summary: '[New] Launch a vEcoli simulation workflow (engine/composite, generations,
        seeds, condition)'
      description: 'Run a vEcoli simulation workflow with simplified parameters.


        This endpoint reads the workflow configuration from the vEcoli repo on the
        HPC

        system and allows overriding specific parameters via query params.'
      operationId: run-ecoli-simulation-new
      parameters:
      - name: simulator_id
        in: query
        required: true
        schema:
          type: integer
          description: '`database_id` of the simulator object returned by /core/v1/simulator/upload'
          title: Simulator Id
        description: '`database_id` of the simulator object returned by /core/v1/simulator/upload'
      - name: experiment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Unique experiment identifier
          title: Experiment Id
        description: Unique experiment identifier
      - name: simulation_config_filename
        in: query
        required: false
        schema:
          type: string
          description: Config filename in vEcoli/configs/. Use GET /simulations/discovery
            to list available files.
          default: api_simulation_default.json
          title: Simulation Config Filename
        description: Config filename in vEcoli/configs/. Use GET /simulations/discovery
          to list available files.
      - name: num_generations
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of generations to simulate
          title: Num Generations
        description: Number of generations to simulate
      - name: num_seeds
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of initial seeds (lineages)
          title: Num Seeds
        description: Number of initial seeds (lineages)
      - name: composite
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - v2ecoli
            - vecoli
            type: string
          - type: 'null'
          description: 'Ray two-engine comparison: ''v2ecoli'' (ported) or ''vecoli''
            (imported via build_composite_native). When set, runs the comparison ensemble
            driver instead of the phase0 ensemble.'
          title: Composite
        description: 'Ray two-engine comparison: ''v2ecoli'' (ported) or ''vecoli''
          (imported via build_composite_native). When set, runs the comparison ensemble
          driver instead of the phase0 ensemble.'
      - name: condition
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Growth condition/media for the comparison run (e.g. basal,
            acetate).
          title: Condition
        description: Growth condition/media for the comparison run (e.g. basal, acetate).
      - name: max_generations
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Generations per lineage for the comparison ensemble.
          title: Max Generations
        description: Generations per lineage for the comparison ensemble.
      - name: vecoli_source
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - upstream
            - vivarium-process
            type: string
          - type: 'null'
          description: 'How the genuine vEcoli side runs (composite=''vecoli'' only):
            ''upstream'' (default, ~50 pbg steps) or ''vivarium-process'' (vEcoli
            as one pbg node with vivarium-core''s Engine inside).'
          title: Vecoli Source
        description: 'How the genuine vEcoli side runs (composite=''vecoli'' only):
          ''upstream'' (default, ~50 pbg steps) or ''vivarium-process'' (vEcoli as
          one pbg node with vivarium-core''s Engine inside).'
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Description of the simulation
          title: Description
        description: Description of the simulation
      - name: run_parca
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: If true, run the simulation parameter calculator prior to running
            simulation (re-parameterizes simulation workflow).
          title: Run Parca
        description: If true, run the simulation parameter calculator prior to running
          simulation (re-parameterizes simulation workflow).
      - name: observables
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Dot-separated vEcoli output paths to observe. E.g. ['bulk',
            'listeners.mass.cell_mass']. Maps to engine_process_reports in the vEcoli
            config. If omitted, all outputs are emitted.
          title: Observables
        description: Dot-separated vEcoli output paths to observe. E.g. ['bulk', 'listeners.mass.cell_mass'].
          Maps to engine_process_reports in the vEcoli config. If omitted, all outputs
          are emitted.
      - name: ecoli_sources_uri
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: S3 URI for the ECOLI_SOURCES env var on the simulation container.
            Set automatically when ecoli_sources_repo_url is provided, or manually
            via the CLI's --sources flag.
          title: Ecoli Sources Uri
        description: S3 URI for the ECOLI_SOURCES env var on the simulation container.
          Set automatically when ecoli_sources_repo_url is provided, or manually via
          the CLI's --sources flag.
      - name: ecoli_sources_overlays
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Semicolon-separated overlay manifest URIs for ECOLI_SOURCES_OVERLAYS.
          title: Ecoli Sources Overlays
        description: Semicolon-separated overlay manifest URIs for ECOLI_SOURCES_OVERLAYS.
      - name: ecoli_sources_repo_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: GitHub repo URL for ecoli-sources data. The server downloads
            and syncs to S3 automatically, then injects ECOLI_SOURCES on the container.
            No AWS CLI needed on the client.
          title: Ecoli Sources Repo Url
        description: GitHub repo URL for ecoli-sources data. The server downloads
          and syncs to S3 automatically, then injects ECOLI_SOURCES on the container.
          No AWS CLI needed on the client.
      - name: ecoli_sources_ref
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Git ref (branch/tag/commit) for ecoli_sources_repo_url. Defaults
            to 'main'.
          title: Ecoli Sources Ref
        description: Git ref (branch/tag/commit) for ecoli_sources_repo_url. Defaults
          to 'main'.
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Free-form tags to attach to this simulation for later filtering
            (e.g. 'cd1'). Repeat the param for multiple tags. Tags can also be added
            later via POST /simulations/{id}/tags.
          title: Tags
        description: Free-form tags to attach to this simulation for later filtering
          (e.g. 'cd1'). Repeat the param for multiple tags. Tags can also be added
          later via POST /simulations/{id}/tags.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_run-ecoli-simulation-new'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Simulations
      summary: List all simulation specs uploaded to the database
      operationId: list-ecoli-simulations
      parameters:
      - name: experiment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Comma-separated list of experiment IDs to filter by. Example:
            ''sim31-baseline-60bb,sim33-violacien-seeds1000-generations10-9617'''
          title: Experiment Id
        description: 'Comma-separated list of experiment IDs to filter by. Example:
          ''sim31-baseline-60bb,sim33-violacien-seeds1000-generations10-9617'''
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated list of tags to filter by (e.g. 'cd1'). Tags
            are free-form data on each simulation; an unknown tag simply matches nothing.
            Use GET /api/v1/simulations/tags to list tags present in the database.
          title: Tag
        description: Comma-separated list of tags to filter by (e.g. 'cd1'). Tags
          are free-form data on each simulation; an unknown tag simply matches nothing.
          Use GET /api/v1/simulations/tags to list tags present in the database.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Simulation'
                title: Response List-Ecoli-Simulations
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}:
    get:
      tags:
      - Simulations
      summary: Get Simulation
      operationId: get-ecoli-simulation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          description: Database ID of the simulation
          title: Id
        description: Database ID of the simulation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Simulation'
                - type: 'null'
                title: Response Get-Ecoli-Simulation
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/status:
    get:
      tags:
      - Simulations
      summary: Get the simulation status record by its ID
      operationId: get-ecoli-simulation-status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/chain-progress:
    get:
      tags:
      - Simulations
      summary: Get real per-seed aggregate progress for a chain-dispatch campaign
      description: "Backlog item 6: real seed-level progress (succeeded/failed/in-progress\n\
        counts) for a chain-dispatch campaign (backlog item 33) \u2014 the SAME data\n\
        ``/simulations/{id}/status`` already computes internally and collapses to\n\
        one coarse phase, exposed at its real granularity. 404 when the\nsimulation/HpcRun\
        \ doesn't exist; 409 when it exists but isn't a\nchain-dispatch campaign (a\
        \ plain single-shot run has nothing to\naggregate \u2014 callers should use\
        \ ``/status`` for those instead)."
      operationId: get-ecoli-simulation-chain-progress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainProgress'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/events:
    get:
      tags:
      - Simulations
      summary: Structured events of a simulation run (engine, runner and dispatch
        components), flat or as the span tree
      description: 'Observability plan D4d: what the run''s tasks reported, without
        AWS

        credentials. Events arrive through the scheduler''s ingester from the tasks''

        ``events.jsonl`` objects plus the API''s own dispatcher-layer events; ``tick``

        heartbeats are folded into ``/status`` (``last_event_at``) and never stored.

        404 when the simulation or its run row does not exist.'
      operationId: get-ecoli-simulation-events
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: debug | info | warning | error
          title: Level
        description: debug | info | warning | error
      - name: event
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: exact event name, e.g. process.exception, lineage.generation.end
          title: Event
        description: exact event name, e.g. process.exception, lineage.generation.end
      - name: generation
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Generation
      - name: span_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: cursor of the last event seen (paging)
          title: After
        description: cursor of the last event seen (paging)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1000
          title: Limit
      - name: tree
        in: query
        required: false
        schema:
          type: boolean
          description: also return the span tree with events attached
          default: false
          title: Tree
        description: also return the span tree with events attached
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationEvents'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/tasks:
    get:
      tags:
      - Simulations
      summary: The run's units of work as the backend saw them (Nextflow trace rows
        / chain seed jobs)
      description: 'Observability plan D4d. Nextflow: one row per ``trace.csv`` task
        (its

        ``job_id`` is the Batch job id); chain dispatch: one row per seed job with

        Batch''s status reason; other backends: an empty list. 404 when the

        simulation or its run row does not exist.'
      operationId: get-ecoli-simulation-tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimulationTask'
                title: Response Get-Ecoli-Simulation-Tasks
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/cancel:
    delete:
      tags:
      - Simulations
      summary: Cancel a running simulation
      description: Cancel a running simulation by killing its backend job.
      operationId: cancel-ecoli-simulation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          description: Database ID of the simulation
          title: Id
        description: Database ID of the simulation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/log:
    get:
      tags:
      - Simulations
      summary: Get the structured output of a given simulation workflow log.
      operationId: get-ecoli-simulation-log
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: truncate
        in: query
        required: false
        schema:
          type: boolean
          description: If true, return only the Nextflow header + final status block
            (separated by '... truncated ...'). Set to false for the full log.
          default: true
          title: Truncate
        description: If true, return only the Nextflow header + final status block
          (separated by '... truncated ...'). Set to false for the full log.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/analysis:
    post:
      tags:
      - Simulations
      summary: Run standalone analysis on existing simulation output
      operationId: run-ecoli-simulation-analysis
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          description: Database ID of a completed simulation.
          title: Id
        description: Database ID of a completed simulation.
      - name: modules
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'JSON object mapping analysis domains to module configs. E.g.
            ''{"single": {"ptools_rna": {"n_tp": 10}}}''. If omitted, runs default
            ptools modules.'
          title: Modules
        description: 'JSON object mapping analysis domains to module configs. E.g.
          ''{"single": {"ptools_rna": {"n_tp": 10}}}''. If omitted, runs default ptools
          modules.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run-Ecoli-Simulation-Analysis
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parca/new-gene-cache:
    post:
      tags:
      - EcoliSim
      summary: Stamp an induction level onto a completed ParCa dataset's cache (backlog
        item 105)
      operationId: run-new-gene-cache
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGeneCacheRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewGeneCacheJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parca/variant-cache:
    post:
      tags:
      - EcoliSim
      summary: Stamp native-gene perturbations onto a completed ParCa dataset's cache
        (backlog item 451)
      operationId: run-variant-cache
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantCacheRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantCacheJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/analyses:
    get:
      tags:
      - Analyses
      summary: List the existing (pre-run) analyses for a simulation
      operationId: list-simulation-analyses
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          description: Database ID of the simulation
          title: Id
        description: Database ID of the simulation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperimentAnalysisDTO'
                title: Response List-Simulation-Analyses
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/tags:
    post:
      tags:
      - Simulations
      summary: Attach one or more free-form tags to an existing simulation
      operationId: add-simulation-tags
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          description: Database ID of the simulation
          title: Id
        description: Database ID of the simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_add-simulation-tags'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/data:
    post:
      tags:
      - Simulations
      summary: Get simulation omics data as a downloadable tar.gz archive
      description: "Get simulation outputs as a tar.gz archive.\n\nChoose response_type\
        \ based on your use case:\n- **file**: Creates the archive and returns it\
        \ as a downloadable file.\n  Best for browser downloads and Swagger UI - shows\
        \ a \"Download\" button.\n- **streaming**: Streams the archive in chunks as\
        \ it's created.\n  Better for very large files or when you want to start processing\
        \ before download completes."
      operationId: get-ecoli-simulation-data
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          description: Database ID of the simulation.
          title: Id
        description: Database ID of the simulation.
      - name: response_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SimulationAnalysisDataResponseType'
          description: 'Response type: ''file'' for direct download (recommended for
            browsers/Swagger UI), ''streaming'' for chunked streaming response (better
            for large files or programmatic access)'
          default: file
        description: 'Response type: ''file'' for direct download (recommended for
          browsers/Swagger UI), ''streaming'' for chunked streaming response (better
          for large files or programmatic access)'
      responses:
        '200':
          description: A tar.gz archive containing simulation output files
          content:
            application/json:
              schema: {}
            application/gzip: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulations/{id}/observables/index:
    get:
      tags:
      - Simulations
      summary: List observables available in a simulation's emitter store (S3)
      operationId: get-simulation-observables-index
      parameters:
