  /env-worker/v1/relay/workers/{job_name}/call:
    post:
      tags:
      - Env Worker
      summary: Forward one JSON-RPC call to a relayed env worker
      description: "One request, one reply \u2014 the worker protocol is already request/response.\n\
        \nDeliberately RAW: whatever the worker returned is handed back untouched,\n\
        sentinels included. This is the escape hatch, and a caller reaching for it\n\
        has asked for the protocol rather than for an interpretation of it. The\n\
        named endpoints below are where sentinels become status codes."
      operationId: call-relayed-env-worker
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayCallRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayCallResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /env-worker/v1/relay/workers/{job_name}:
    delete:
      tags:
      - Env Worker
      summary: Close a relayed worker's connection and delete its Job (idempotent)
      description: "Stop a worker. NOT ownership-checked, deliberately \u2014 and\
        \ its tasks are\nsettled with attribution instead.\n\nStopping a worker is\
        \ overwhelmingly an AUTOMATIC operation: the workbench's\npool calls it on\
        \ LRU eviction, idle reap, dead-worker replacement and process\nexit. The\
        \ pool has no identity to present, so an ownership check here would\neither\
        \ break it or have to let unidentified callers through \u2014 which is the\n\
        very bypass such a check would exist to close, and would leave the perverse\n\
        rule that anonymous callers may stop workers while identified ones may not.\n\
        \nSo the worker is shared infrastructure with an automatic lifecycle; the\
        \ task\nis the unit of work that has an owner. What is owed to someone whose\
        \ task\ndies with a worker is not a veto but an EXPLANATION: their task moves\
        \ to a\nterminal state naming what happened and, where identity is configured,\
        \ who\ndid it \u2014 rather than hanging in `running` until somebody wonders."
      operationId: stop-relayed-env-worker
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Stop-Relayed-Env-Worker
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /env-worker/v1/relay/workers/{job_name}/generators:
    get:
      tags:
