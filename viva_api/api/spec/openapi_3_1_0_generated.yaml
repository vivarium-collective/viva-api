  /core/v1/simulator/upload:
    post:
      tags:
      - EcoliSim
      summary: Upload a new simulator (vEcoli) version.
      description: '``stage_private_fork``/``vecoli_private_commit``: stage vEcoli-private
        -- not the

        public vEcoli mirror -- as this image''s own wrapped ``/app/vEcoli`` fork,
        so a config''s

        ``!ParameterSerializer[...]`` tag whose value only exists in the private fork''s
        own

        param_store can resolve on a remote dispatch. Off by default (identical build
        to

        before these params existed). ``vecoli_private_commit`` is REQUIRED when

        ``stage_private_fork`` is True -- no "latest" auto-resolution, so the exact
        commit

        staged is always an explicit, visible choice. 400s if the resolved build path
        for

        ``simulator.git_repo_url`` does not support it (only the v2ecoli/sms-ecoli
        Ray path

        wraps a separate vEcoli fork inside its own image at all).


        ``include_submit_image``: also build the Nextflow HEAD image beside the task

        image (base + JRE + the nextflow binary, pushed as ``<repo>:<sha>-submit``).


        Only the process that runs ``nextflow run`` needs a JVM -- Batch TASKS run
        the

        plain science image, which already carries the AWS CLI Nextflow needs to stage

        an S3 work dir. So this is a thin derived layer.


        **Omitted now means "build it where possible"**, changed once the Nextflow
        path

        became operational. It was off on the reasoning that "every build would otherwise

        pay for it"; measured across four builds that cost is **+72 MB and +15 s**
        (ECR

        dedups the ~5.7 GB base the two images share), against a dispatch that otherwise

        fails at the container image pull plus a full rebuild. vEcoli''s build path
        has

        always built its own ``-submit`` image unconditionally, so this makes the
        paths agree.


        Three-valued: ``true`` DEMANDS the image and 400s on a backend that cannot
        build

        one; omitted builds it where the backend can and skips quietly where it cannot;

        ``false`` skips it.'
      operationId: insert-simulator-version
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      - name: include_submit_image
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Submit Image
      - name: stage_private_fork
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Stage Private Fork
      - name: vecoli_private_commit
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vecoli Private Commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Simulator'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
