          type: integer
          title: Task Id
        job_name:
          type: string
          title: Job Name
        method:
          type: string
          title: Method
        status:
          type: string
          title: Status
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_by:
