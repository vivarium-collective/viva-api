[pytest]
log_cli = true
log_cli_level = INFO
markers =
    integration: marks tests as integration tests (require SSH/HPC access)
    slurm: needs a SLURM backend; parameterised over --slurm-backend (default: a cluster in Docker when Docker is up)
    cluster_only: needs the real submit host, not the container; never runs in CI
    real_aws: this test genuinely calls AWS; exempts it from the autouse no-real-AWS guard (tests/fixtures/aws_guard.py)
