# vivarium-workbench Deployment + Service — a PEER of the api service (modeled on
# api.yaml). The workbench renders workspaces in-process (imports pbg_v2ecoli via
# build_core) and delegates ALL compute/storage to sms-api over in-cluster HTTP;
# it needs no Postgres, IRSA, or AWS creds.
#
# This file is intentionally NOT listed in base/kustomization.yaml — the workbench
# only makes sense on the EKS/GovCloud (Stanford) deployments (it needs the ALB
# TargetGroupBinding + an EBS PVC), so ONLY the Stanford overlays reference it
# directly (resources: ../../base/workbench.yaml). The rke/local (SLURM) overlays
# must not deploy it.
#
# Env-specific bits come from the overlay: namespace, image tag (images:), the EBS
# PVC (workbench-pvc.yaml), and the TargetGroupBinding. The image + ghcr pull
# secret come from this repo's overlay conventions; the workspace is served from
# the mounted EBS PVC, seeded once from the image's baked-in /app/v2ecoli.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
  labels:
    app: vivarium-workbench
spec:
  # Single replica: the workbench holds a git working copy + SQLite on an RWO EBS
  # volume, so exactly one writer.
  replicas: 1
  # Recreate (not RollingUpdate): a rollout must NOT surge a second pod. The default
  # RollingUpdate maxSurge=25% rounds up to 1 for a single replica, so it briefly runs
  # two pods — both trying to mount the ReadWriteOnce EBS volume. If the new pod lands
  # on a different node it wedges on a Multi-Attach error until the old one dies.
  # Recreate terminates the old pod fully before starting the new one: never two pods,
  # never a volume conflict.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vivarium-workbench
  template:
    metadata:
      labels:
        app: vivarium-workbench
    spec:
      # Run as ROOT (uid 0). The combined image installs its uv-managed CPython
      # under /root/.local/share/uv/python (root home, mode 700); as any non-root
      # uid the interpreter cannot read its own stdlib there — sys.base_prefix
      # falls back to the build-time /install and Python dies with "No module named
      # 'encodings'". So this image MUST run as root. (No restricted PodSecurity
      # enforcement on this namespace; unlike api, which runs as 17163 by choice.)
      # fsGroup 0 so the EBS workspace volume is root-writable.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      # Seed the (initially empty) EBS workspace ONCE from the image's baked-in
      # v2ecoli workspace. `workspace.yaml` is the seeded-marker so pod restarts /
      # user edits are never clobbered (and EBS's ext4 lost+found is ignored).
      initContainers:
        - name: seed-workspace
          image: ghcr.io/vivarium-collective/vivarium-workbench:latest
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
            - |
              # "Already seeded" is workspace.yaml OR our own stamp. workspace.yaml
              # alone was the guard, and it works only because v2ecoli happens to
              # have one at its root — a SEED_REPO without one would re-clone on
              # every pod start. The stamp makes the guard a property of the seeding,
              # not of whatever repo the deployment points at.
              if [ ! -f /workspace/workspace.yaml ] && [ ! -f /workspace/.viv-seeded ]; then
                if [ -n "${SEED_REPO:-}" ]; then
                  # Escape hatch: seed from a specific repo. Not the default, and NOT how a
                  # site should get science code — that arrives with a materialized build.
                  echo "seeding /workspace by cloning $SEED_REPO @ $SEED_REF";
                  rm -rf /workspace/.seed-tmp;
                  git clone --branch "$SEED_REF" "$SEED_REPO" /workspace/.seed-tmp &&
                    cp -a /workspace/.seed-tmp/. /workspace/ &&
                    rm -rf /workspace/.seed-tmp &&
                    chown -R 0:0 /workspace;
                elif [ -d /app/v2ecoli ]; then
                  # Fat-image path (pre-#932). Kept so an older image still seeds.
                  echo "seeding /workspace from baked-in /app/v2ecoli";
                  cp -a /app/v2ecoli/. /workspace/;
                  # `cp -a` preserves the IMAGE LAYER's ownership — a build-time uid that
                  # doesn't exist in this container (observed: .git owned by 17163:0). The
                  # pod runs as root, so git then refuses every command with "fatal:
                  # detected dubious ownership". Normalize so git works on the seeded repo.
                  chown -R 0:0 /workspace;
                else
                  # DEFAULT: a trivial workspace (~484 KiB). The base is an AUTHORING SHELL,
                  # not a science checkout — REFACTOR-PLAN §0A.5's agreed target, and what
                  # makes §2A.8's invariant hold rather than be violated by the seed itself.
                  #
                  # Science code arrives by SWITCHING to a build, not by being seeded here:
                  # the build list comes from viva-api's simulator registry
                  # (list_build_sources -> client.list_simulators), and materialize_build
                  # downloads that build's repo@commit tarball and stamps .viv-build.json.
                  # So a chosen workspace is image-backed AND carries workspace/studies at
                  # the commit it ran against.
                  #
                  # Seeding v2ecoli here instead produced the one state §2A.8 prohibits —
                  # science code with no build stamp — so every interactive worker call on
                  # the base raised "has no build stamp". An empty base has nothing to
                  # introspect and needs no worker, which is exactly why it is consistent.
                  echo "seeding /workspace with a minimal scaffold (name=$SEED_NAME)";
                  vivarium-workbench scaffold-workspace --name "$SEED_NAME" --target /workspace &&
                    chown -R 0:0 /workspace;
                  # The scaffold leaves `git init` to its "Quick setup" instructions, but the
                  # dashboard's workstream flow commits every action to a feature branch, so
                  # an un-inited base would fail at the first authoring action rather than at
                  # setup. Make the shell a real repo up front.
                  if [ ! -d /workspace/.git ]; then
                    # Our own stamp is deployment state, not workspace content — untracked it
                    # would leave the authoring shell permanently dirty in the dashboard.
                    # Deployment state that lives inside the workspace dir: our seed stamp,
                    # and pbg-state (the Deployment mounts /root/.pbg at this subPath).
                    # Untracked, they leave the authoring shell permanently dirty.
                    for f in .viv-seeded pbg-state; do
                      grep -qx "$f" /workspace/.gitignore 2>/dev/null ||
                        echo "$f" >> /workspace/.gitignore;
                    done;
                    git -C /workspace init -q -b main &&
                      git -C /workspace -c user.email=workbench@vivarium -c user.name=workbench \
                        add -A &&
                      git -C /workspace -c user.email=workbench@vivarium -c user.name=workbench \
                        commit -q -m "feat: workspace bootstrap" &&
                      echo "initialized git at $(git -C /workspace rev-parse --short HEAD)";
                  fi;
                fi
                date -u +"%Y-%m-%dT%H:%M:%SZ ${SEED_REPO:-scaffold}${SEED_REPO:+@$SEED_REF}" > /workspace/.viv-seeded;
              else
                echo "/workspace already seeded; skipping";
              fi
              # Deployment override for the pbg-ptools Omics Viewer: the baked-in
              # workspace.yaml sets ui.ptools_server_url to a LOCAL dev container
              # (http://localhost:1555). In-cluster the viewer builds a link the
              # user's BROWSER opens, so it must be the browser-reachable PTools URL
              # (ALB/tunnel), supplied per-overlay via PTOOLS_SERVER_URL. Re-applied
              # every start so overlay changes take effect; skipped when unset.
              if [ -n "${PTOOLS_SERVER_URL:-}" ]; then
                python - <<'PY'
              import os, pathlib, yaml
              p = pathlib.Path("/workspace/workspace.yaml")
              d = yaml.safe_load(p.read_text()) or {}
              d.setdefault("ui", {})["ptools_server_url"] = os.environ["PTOOLS_SERVER_URL"]
              p.write_text(yaml.safe_dump(d, sort_keys=False))
              print("set ui.ptools_server_url =", os.environ["PTOOLS_SERVER_URL"])
              PY
              fi
              # Deployment override for the pbg-ptools Omics Viewer DATA overlay:
              # the launcher builds a TSV URL off ui.dashboard_public_base_url that
              # the IN-CLUSTER ptools pod fetches, so it must be the workbench's
              # in-cluster Service URL (incl. the /workbench base path) — not the
              # local-dev host.docker.internal value baked into workspace.yaml.
              # Also clear ui.ptools_data_dir so the launcher uses HTTP delivery
              # (the ptools pod has no workspace mount). Skipped when unset.
              if [ -n "${DASHBOARD_PUBLIC_BASE_URL:-}" ]; then
                python - <<'PY'
              import os, pathlib, yaml
              p = pathlib.Path("/workspace/workspace.yaml")
              d = yaml.safe_load(p.read_text()) or {}
              ui = d.setdefault("ui", {})
              ui["dashboard_public_base_url"] = os.environ["DASHBOARD_PUBLIC_BASE_URL"]
              ui.pop("ptools_data_dir", None)
              p.write_text(yaml.safe_dump(d, sort_keys=False))
              print("set ui.dashboard_public_base_url =", os.environ["DASHBOARD_PUBLIC_BASE_URL"], "; cleared ui.ptools_data_dir")
              PY
              fi
          env:
            # The base workspace is an AUTHORING SHELL, not a science checkout.
            # Empty SEED_REPO (the default) scaffolds a trivial workspace; science
            # code arrives by switching to a build, which is image-backed and
            # carries its own studies. Set SEED_REPO only for a site that
            # deliberately wants a specific checkout as its base.
            - name: SEED_REPO
              value: ""
            - name: SEED_REF
              value: "main"
            - name: SEED_NAME
              value: "base"
            # Browser-reachable PTools base for the Omics Viewer; set per-overlay.
            # Empty = leave the workspace's own ui.ptools_server_url untouched.
            - name: PTOOLS_SERVER_URL
              value: ""
            # In-cluster workbench Service URL (with the /workbench base path) that
            # the ptools pod fetches study TSVs from for the Omics Viewer overlay.
            # Empty = leave the workspace's own ui.dashboard_public_base_url +
            # ui.ptools_data_dir untouched (local-dev behavior). Set per-overlay.
            - name: DASHBOARD_PUBLIC_BASE_URL
              value: ""
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: workbench
          # Overlays pin the tag via `images:` (build with deploy/build-and-push.sh).
          image: ghcr.io/vivarium-collective/vivarium-workbench:latest
          imagePullPolicy: Always
          command: ["vivarium-workbench"]
          args:
            - "serve"
            - "--workspace"
            - "/workspace"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            # Served under /workbench so it co-tenants the internal ALB with sms-api
            # (the sms-cdk /workbench/* + /bigraph-loom/* listener rules forward to
            # the workbench target group). uvicorn root_path is derived from this.
            - "--base-path"
            - "/workbench"
          ports:
            - containerPort: 8000
          env:
            # The ONLY backend: sms-api's in-cluster Service. Same-namespace short
            # DNS (the workbench is a peer of `api` in the sms-api namespace).
            - name: SMS_API_BASE
              value: "http://api:8000"
            - name: VIVARIUM_WORKBENCH_WORKSPACE
              value: "/workspace"
            # Item 21 (durability): materialized/switched simulator builds, and
            # each session's own isolated clone of one
            # (remote_build_source.materialize_build /
            # .materialize_session_build in vivarium-workbench), used to live
            # under this container's ephemeral root filesystem -- a legitimate
            # pod restart (image bump, node eviction, OOM-kill) silently wiped
            # every in-progress session's build cache (PR #227 fixed the
            # unrelated-deploy blast radius; this closes the residual root
            # cause). Points the SAME durable path the code already defaults to
            # (Path.home()/".pbg"/"build-cache" == /root/.pbg/build-cache at
            # uid 0) at the second volumeMount below (workbench-workspace PVC,
            # subPath: build-cache) so it survives restarts. Explicit here even
            # though it matches the code's own default -- self-documenting, and
            # still correct if that default ever changes.
            - name: VIVARIUM_WORKBENCH_BUILD_CACHE
              value: "/root/.pbg/build-cache"
            # The internal ALB terminating /workbench REWRITES the Host header and
            # does NOT emit X-Forwarded-Host, so the CSRF same-origin check (and
            # --trust-proxy) can never match the browser's Origin. Declare the
            # browser-facing origin explicitly so POST/DELETE (Run, Run-remotely,
            # saves) are admitted. This is the SSM-tunnel origin every operator
            # reaches the dashboard through (sms-proxy.sh → localhost:8080). base/
            # workbench is Stanford-tunnel-only, so this fixed origin lives here.
            - name: VIVARIUM_WORKBENCH_ALLOWED_ORIGINS
              value: "http://localhost:8080"
            # Pinned-build remote runs: the "Run on remote" card submits sims
            # against the latest ALREADY-BUILT simulator for this repo@branch
            # (resolved from sms-api in-cluster), skipping the per-run git
            # push/build/login entirely. This is the demo model — one pinned
            # build, many simulation configs — and it sidesteps the pod's
            # unwritable /workspace git remote + protected-main push. Enabled
            # declaratively here; no human GitHub token is embedded.
            #
            # repo/branch MUST be CovertLabEcoli/sms-ecoli — the canonical
            # workflow's own workspace, never vivarium-collective/v2ecoli (a
            # structurally-diverged sibling repo). This pin originally targeted
            # v2ecoli (2026-07-13, pre-dates sms-ecoli becoming the canonical
            # target) and was never updated — caused a real, live workspace-
            # identity-mismatch dispatch on smscdk (caught 2026-08-11 before
            # any spend; see the regression test below). Do not revert without
            # updating tests/test_deploy_config.py too.
            - name: VIVARIUM_WORKBENCH_REMOTE_PINNED
              value: "1"
            - name: VIVARIUM_WORKBENCH_REMOTE_REPO_URL
              value: "https://github.com/CovertLabEcoli/sms-ecoli"
            - name: VIVARIUM_WORKBENCH_REMOTE_BRANCH
              value: "main"
            # The init container's chown only runs on FIRST seed (it's guarded by
            # the workspace.yaml marker), so a volume seeded before that fix keeps
            # its foreign ownership forever — and any workspace staged by other
            # means later (the /workbench-root/<org__repo> multi-workspace design)
            # may too. Declare the safe.directory exception globally via git's
            # env-config form: no image rebuild, no .gitconfig to manage, and it
            # covers every checkout on the volume rather than one hardcoded path.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: "safe.directory"
            - name: GIT_CONFIG_VALUE_0
              value: "*"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            # Item 21: a SECOND mount of the SAME PVC (no new claim, no new
            # StorageClass) at a disjoint subPath, so materialized build
            # caches persist across restarts without touching the existing
            # /workspace data or requiring an EBS volume expansion up front.
            # Matches this project's original intent (vivarium-workbench's
            # docs/REFACTOR-PLAN.md §2B.3: "workspace (git/YAML/SQLite) +
            # caches (venv, ParCa ~175 MB, `~/.pbg/build-cache`)") -- only the
            # workspace half had shipped until now.
            # Item 21 follow-on (2026-08-26): the mount BELOW made only
            # /root/.pbg/build-cache durable -- one child of ~/.pbg. The
            # directory itself stayed on the container's ephemeral overlay
            # filesystem, and so did `/root/.pbg/workspaces.json`: the REGISTRY
            # of which workspaces exist. Verified on the live smsvpctest pod by
            # comparing device numbers -- /workspace and .../build-cache are both
            # dev 66308 (the EBS PVC) while /root/.pbg and workspaces.json were
            # dev 1048604 (the overlay fs). Consequence: every redeploy kept the
            # workspace BYTES (9.4 GB of them) and threw away the index, so a
            # user's materialized workspaces vanished from the picker and had to
            # be re-materialized. That reads to an end user as "the volume got
            # recycled" even though nothing on the volume was lost -- the pod's
            # workspaces.json had an added_at equal to its own start time, with
            # build-cache/sim82-234dc76 sitting on the PVC unreferenced.
            #
            # Mounting the directory (not just its build-cache child) fixes it.
            # The build-cache mount below is NESTED inside this one and is kept
            # at its existing subPath deliberately: kubelet orders mounts by path
            # depth, so both apply and no existing build-cache data has to move.
            # `servers/` + `servers.lock` (pbg server registrations) become
            # durable as a side effect -- stale entries are re-derived on boot.
            - name: workspace
              mountPath: /root/.pbg
              subPath: pbg-state
            - name: workspace
              mountPath: /root/.pbg/build-cache
              subPath: build-cache
      volumes:
        # Private EBS gp3 PVC (RWO) — workspace + build-cache (via the second
        # subPath mount on the workbench container above). The claim is defined
        # in the overlay (workbench-pvc.yaml). No shared filesystem with the
        # compute: run outputs arrive from S3 via sms-api's download endpoints.
        - name: workspace
          persistentVolumeClaim:
            claimName: workbench-workspace
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: workbench
  labels:
    app: vivarium-workbench
spec:
  ports:
    - name: "8000"
      port: 8000
      targetPort: 8000
  selector:
    app: vivarium-workbench
