  # 4879073c, d6132ae4 -- deployed live from their own branches ahead of
  # merge, git tracking simply never caught up). Confirmed live via the real
  # pod image and /version before this edit. Same drift pattern already
  # documented on the sms-api-stanford (prod) workbench overlay.
  # 0.9.56 (item 86/88, PR #276): auto-triggers the analysis job once a
  # multi-node composite dispatch (e.g. colony) completes --
  # JobScheduler.update_multi_node_jobs/_advance_multi_node_job, additive,
  # verified line-by-line to never touch chain-dispatch code. Also includes
  # 0.9.54 (extra_params passthrough) and 0.9.55 (MNP submission +
  # HpcRun tracking), neither of which got its own tag at the time.
  # 0.9.57 (PR #283): GET .../observables/index now returns a clear 409 for a
  # chain-dispatch campaign or multi-node composite instead of falling through
  # to a store neither shape ever writes -- found live via a real cplong bug
  # report against this same namespace (see the phase0 S3-layout fix,
  # v2ecoli#603/sms-ecoli#123, a separate repo, already deployed via sim
  # builds -- not a viva-api change).
  # 0.9.61 (PR #299): cplong re-tested #283 live and found 2 real bugs on top
  # of it -- GET /analyses/{id}/data returned 200 [] for a real, completed,
  # non-empty analysis (fetch_analysis_data passed the full s3://<bucket>/...
  # result_uri straight into S3FilePath, which is bucket-relative -- the
  # SECOND time this exact bug class has hit this file); GET /analyses/{id}/
  # plots 500'd unconditionally for every Ray/K8s analysis (no S3-backed
  # implementation existed at all). Also clarifies the #283 409's message
  # (the analysis id is a separate id space from the simulation id).
  # 0.9.81 (PR #361, item 98): adds simulator_id/document/compute_backend to
  # the /compose/v1 endpoints. simulator_id resolves through the existing
  # SimulatorVersion.git_commit_hash registry and threads into image/cache
  # selection (reuses SimulationServiceRay._image_uri verbatim); a new
  # POST /compose/v1/simulation/run-document accepts an inline JSON document
  # instead of a multipart upload; compute_backend picks a registered backend
  # explicitly (400s loud if unregistered, no silent fallback). All 3 params
  # are optional -- unset, behavior is byte-for-byte what 0.9.80 already did.
  # 0.9.86 (PR #376, item 105): chain-dispatch's --composite-id is now
  # caller-selectable instead of hardcoded to ecoli_baseline (a new optional
  # composite_id field, same extra="allow"/restart-safe pattern as
  # injected_processes/variants). Unblocks the reachability half of Run1/K4's
  # own composite (reactor_bird_coupled) -- science + cache-staging remain
  # separate, still-open blockers. Unset is byte-identical to 0.9.85.
  # 0.9.87 (PR #378, item 105): scripts/build_new_gene_cache.py (the script
  # that stamps a real induction LEVEL onto an already-ParCa'd cache -- the
  # "other half" of new_genes presence/absence) is now remotely reachable.
  # New submit_new_gene_cache_job + POST /parca/new-gene-cache, staging a
  # commit's plain cache and writing a variant-labeled derived one. Not
  # auto-wired into JobScheduler's own state machine (would need a new
  # DB-level JobType member -- deliberate follow-up, not done here). All
  # additive; every existing caller unaffected.
  # 0.9.88 (PR #380, item 105): drops run_new_gene_cache's own broken
  # get_hpcrun_by_ref(job_type=PARCA) precondition -- found live, before any
  # real dispatch hit it, while verifying 0.9.87. Chain-dispatch's real ParCa
  # path (run_workflow_legacy) never inserts a JobType.PARCA-tagged HpcRun
  # row (only the legacy SLURM-only run_parca handler does), so the
  # precondition 409'd on every real chain-dispatch-originated ParcaDataset.
  # Removed entirely, matching this codebase's pure-passthrough philosophy.
  # 0.9.93 (PR #406, item 105/#401): injected_processes_from_config resolves
  # swap_processes/add_processes/exclude_processes PER FIELD instead of
  # choosing the whole nested-vs-flat shape once -- a nested submit setting
  # only swap_processes was silently dropping a config's own flat
  # add_processes/exclude_processes (observed live, sim 296:
  # mecillinam_wellmixed.json's own 4 add_processes vanished under a nested
  # metabolism swap, unreported; independently reproduced by jcschaff the
  # same night as a 44.5s collapse). Nested wins on a real per-field
  # conflict, logged rather than silent. Same root cause as #392/0.9.92 --
  # reconstructing the block instead of merging into it.
