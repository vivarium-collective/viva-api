  # ptools 0.5.9 -> 0.9.53 (DEV ONLY — prod sms-api-stanford stays on 0.5.9 while
  # this soaks). The long-standing 0.5.9 pin existed because CI builds only
  # sms-api (scripts/build_action.sh), so no newer sms-ptools existed on ghcr.io
  # to point at. That is no longer true: 0.9.53 was built and pushed by hand via
  # `kustomize/scripts/build_and_push.sh` (docker buildx, linux/amd64).
  #
  # This is NOT a version-number-only rebuild. 0.5.9 was built from the 30.0
  # PREVIEW archive, which shipped 30.0 Pathway Tools binaries over 29.5 PGDB
  # data (aic-export/pgdbs/biocyc/{ecocyc,metacyc,mg1655-with-re548viocyc}/29.5).
  # 0.9.53 is built from the official release, aic-export-30.0.tar.gz, which
  # carries those three PGDBs at 30.0 and adds a fourth, mg1655-rph-vio-m5cyc at
  # 30.5. (The preview has been kept as aic-export.30.0-20260111.tar.gz; the ADD
  # in Dockerfile-ptools follows the dot -> dash rename of the release.)
  #
  # So the BioCyc data served on :1555 genuinely changes with this bump -- the
  # Lisp runtime image moves 1.232 -> 1.241 GB and 83 of 1998 common files
  # differ. Exercise the pbg-ptools viewer and any BioCyc-backed paths here
  # before promoting to prod. See commit bad12adb for the full archive diff.
  #
  # ptools is now tagged off the sms-api version line (whatever version.py read
  # when it was rebuilt) instead of versioning independently. It therefore LAGS
  # sms-api between rebuilds -- 0.9.53 is this build; sms-api has since moved to
  # 0.9.55 on its own. Tag the next ptools rebuild with version.py as of then;
  # do not bump this tag without actually building and pushing that image.
