  # holding GovCloud SSO creds. It now runs as SA `workbench`
  # (workbench-serviceaccount.yaml) with the read-only IRSA role sms-cdk's BatchStack
  # creates (smsvpctest-workbench-s3-read). Requires that sms-cdk change deployed
  # first. The longer-term alternative stays viva-api#648 (serve the artifacts through
  # sms-api, which already holds S3 creds via the batch-submit IRSA role).
  - name: ghcr.io/vivarium-collective/vivarium-workbench
    newTag: 0.3.84

replicas:
  - count: 1
    name: api
  - count: 1
    name: ptools
  # Single writer: workbench holds a git working copy + SQLite on an RWO EBS volume.
  # Pinned here explicitly (not just inherited from base/workbench.yaml) so the count
  # lives alongside every other deployment's.
  - count: 1
    name: workbench
  - count: 0
    name: redis
  - count: 0
    name: haproxy-ssh

resources:
#  - ingress.yaml
  - target-group-binding.yaml # to accept traffic from predefined ALB rather than use an ingres
  - secret-ghcr.yaml
  - secret-shared.yaml
  # vivarium-workbench: peer Deployment+Service (base/workbench.yaml is referenced
  # directly, NOT via base/kustomization.yaml, so it deploys ONLY on Stanford) +
  # its EBS PVC. Its TargetGroupBinding is in target-group-binding.yaml above.
  - ../../base/workbench
  - workbench-pvc.yaml
  # The workbench's own ServiceAccount, carrying the read-only S3 IRSA role (see the
  # file header and the workbench serviceAccountName patch below).
  - workbench-serviceaccount.yaml
  - ../../config/sms-api-stanford-test
  - ../../base

patches:
  # Run the workbench as SA `workbench` (workbench-serviceaccount.yaml) instead of the
  # namespace `default`, so it can assume the read-only S3 IRSA role for its remote
  # analysis figures. Dev only; base/workbench stays SA-less for the prod overlay.
  - patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: workbench
    target:
      kind: Deployment
      name: workbench
  - patch: |-
      - op: add
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws-us-gov:iam::476270107793:role/smsvpctest-batch-BatchSubmitIrsaRole31BE49CD-xETZl8o1n6cE
    target:
      kind: ServiceAccount
      name: batch-submit
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: api
  # Remove SLURM/SSH infrastructure from base api.yaml — stanford-test uses
  # K8s/AWS Batch exclusively.  Order: highest index first so removals don't
  # shift the indices of subsequent operations.
  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/5
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/2
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/2
      - op: remove
        path: /spec/template/spec/volumes/1
      - op: remove
        path: /spec/template/spec/volumes/0
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ghcr-secret
          mountPath: /run/secrets/ghcr
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ghcr-secret
          secret:
            secretName: ghcr-secret
            defaultMode: 256
    target:
      kind: Deployment
      name: api
  # ui.* deployment bindings: NOT patched here any more (vivarium-workbench#471
  # phase 4). This overlay used to patch PTOOLS_SERVER_URL and
  # DASHBOARD_PUBLIC_BASE_URL onto the seed-workspace initContainer, which made it
  # rewrite the served /workspace/workspace.yaml on every pod start -- stamping this
  # site's identity into a file that is git-TRACKED in the science repo (v2ecoli,
  # sms-ecoli). Those two values now come from the workbench-deploy-config ConfigMap
  # below, which the workbench reads at request time instead (>=0.3.56's
  # lib/deploy_config.py; this namespace runs 0.3.57).
  #
  # Deleting the patch is all phase 4 needs HERE. The base's mutations are
  # env-gated and default to "" ("empty = leave the workspace untouched"), so with
  # no patch supplying values they simply never fire -- the initContainer is back to
  # doing one job, seeding. The base code is deliberately left in place because
  # ../sms-api-stanford still patches it: prod has no deploy-config ConfigMap and
  # runs a workbench older than the resolver, so removing the base code would
  # silently kill prod's Omics Viewer (it self-gates -- no error, the button just
  # stops rendering). Phase 4 completes when prod migrates: delete its patch too,
  # then the now-dead base code.
  # Env workers: run a simulator's prebuilt image as the env worker
  # (vivarium-workbench#942 / REFACTOR-PLAN §2A.8). Declaring where workers dial
  # back is what SELECTS the remote launcher — the workbench's composition root
  # (lib/env_worker_launcher.default_launcher) goes remote iff this is set, and
  # local otherwise, because a laptop has no cluster. One deployment-wide
  # decision, chosen by topology rather than by any call site.
  #
  # The value is this pod's own IP via the Downward API: the worker connects
  # BACK to us. viva-api may create Jobs but not Services, so a worker pod has
  # no stable DNS name to dial, and the reverse direction also means viva-api
  # needs to discover nothing — we already know our own address.
  #
  # DEV ONLY for now: prod runs a workbench predating the transport, and
  # ../sms-api-stanford-workbench does not set this, so prod stays local.
  #
  # RELAY (plan §C, viva-api#309 + workbench#982): PROXY_BASE selects a third
  # transport in which viva-api holds the worker socket and the workbench
  # reaches it over HTTP. It exists for the case dial-back structurally cannot
  # serve -- a laptop, whose SSM tunnel is laptop-initiated with no inbound path
  # -- and dev is where it gets exercised before anyone depends on it.
  #
  # ADVERTISE_HOST below is left set ON PURPOSE. default_launcher checks
  # PROXY_BASE first, so it is inert while the relay is on, and rollback is then
  # the removal of ONE line rather than a restoration of two. (The precedence is
  # not incidental: a leftover ADVERTISE_HOST shadowing PROXY_BASE would present
  # as a worker that hangs, not as a misconfiguration, so it is pinned by
  # tests/test_proxy_worker_launcher.py.)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: VIVARIUM_WORKBENCH_ENV_WORKER_ADVERTISE_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: VIVARIUM_WORKBENCH_ENV_WORKER_PROXY_BASE
                    value: http://api:8000
    target:
      kind: Deployment
      name: workbench
  # The api side of the same switch. viva-api binds the dial-back listener now,
  # so the worker connects to THIS pod; the value is its own IP via the Downward
  # API for exactly the reason the workbench's was -- viva-api may create Jobs
  # but not Services, so a worker has no stable name to dial and the connection
  # has to run the other way.
  #
  # Absent, the relay endpoints 503 and nothing else changes. That is what let
  # viva-api#309 ship and deploy inert, ahead of this.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: ENV_WORKER_RELAY_ADVERTISE_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  # Caller identity (viva_api/api/auth.py). NAMES a header; it
                  # does NOT authenticate. Nothing in front of this deployment
                  # sets X-Auth-Request-Email today, so anyone may claim any
                  # value -- which is the honest description of what this buys:
                  # attribution, and one accident-prevention rule (you cannot
                  # cancel a task you did not start). It is not a boundary, and
                  # the day something here needs to be a boundary this variable
                  # is not what makes it one.
                  #
                  # Chosen because it is what oauth2-proxy sets, so a future
                  # proxy in front needs no change here. Unset elsewhere: prod
                  # and the UConn sites stay anonymous, which is their current
                  # behaviour exactly.
                  #
                  # Rollback is deleting these two lines; every endpoint then
                  # behaves as it did, and tasks record created_by = NULL.
                  - name: IDENTITY_HEADER
                    value: X-Auth-Request-Email
    target:
      kind: Deployment
      name: api
  # ui.* deployment-config layer (vivarium-workbench#471), phase 2 of lifting
  # these bindings out of the workspace. Mounts the generated
  # workbench-deploy-config ConfigMap read-only and names it via
  # VIVARIUM_WORKBENCH_DEPLOY_CONFIG; the workbench overlays it on top of the
  # served workspace.yaml's ui: block (deployment wins, null unsets).
  #
  # DOUBLY INERT ON PURPOSE. (1) Every value in workbench-deploy.yaml is exactly
  # what the seed initContainer above already stamps into workspace.yaml, so the
  # two agree and nothing changes. (2) The running workbench image predates
  # lib/deploy_config.py, so it ignores the env var and the mount entirely. This
  # existed to prove the plumbing before anything depended on it. As of phase 4
  # (the deleted patch above) it IS the only source for this namespace.
  #
  # Applied to the -test overlay only. The base is shared with sms-api-stanford,
  # where this ConfigMap does not exist -- putting the volume in the base would
  # either wedge prod's pod on a missing ConfigMap or force a prod rollout.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: VIVARIUM_WORKBENCH_DEPLOY_CONFIG
                    value: /etc/vivarium-workbench/deploy.yaml
                volumeMounts:
                  - name: deploy-config
                    mountPath: /etc/vivarium-workbench
                    readOnly: true
            volumes:
              - name: deploy-config
                configMap:
                  name: workbench-deploy-config
    target:
      kind: Deployment
      name: workbench
