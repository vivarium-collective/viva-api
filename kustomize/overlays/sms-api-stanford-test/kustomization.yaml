apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford-test

# STABLE: 0.5.9 | 0.6.2

images:
  # Catches up this overlay's newTag (last committed at 0.9.30) to match what
  # has actually been live here since item 71's Phase 5 pilot work: 0.9.51,
  # 0.9.52, then 0.9.53 (all real, merged commits on main -- fa9b946f,
  # 4879073c, d6132ae4 -- deployed live from their own branches ahead of
  # merge, git tracking simply never caught up). Confirmed live via the real
  # pod image and /version before this edit. Same drift pattern already
  # documented on the sms-api-stanford (prod) workbench overlay.
  # 0.9.56 (item 86/88, PR #276): auto-triggers the analysis job once a
  # multi-node composite dispatch (e.g. colony) completes --
  # JobScheduler.update_multi_node_jobs/_advance_multi_node_job, additive,
  # verified line-by-line to never touch chain-dispatch code. Also includes
  # 0.9.54 (extra_params passthrough) and 0.9.55 (MNP submission +
  # HpcRun tracking), neither of which got its own tag at the time.
  # 0.9.57 (PR #283): GET .../observables/index now returns a clear 409 for a
  # chain-dispatch campaign or multi-node composite instead of falling through
  # to a store neither shape ever writes -- found live via a real cplong bug
  # report against this same namespace (see the phase0 S3-layout fix,
  # v2ecoli#603/sms-ecoli#123, a separate repo, already deployed via sim
  # builds -- not a viva-api change).
  # 0.9.61 (PR #299): cplong re-tested #283 live and found 2 real bugs on top
  # of it -- GET /analyses/{id}/data returned 200 [] for a real, completed,
  # non-empty analysis (fetch_analysis_data passed the full s3://<bucket>/...
  # result_uri straight into S3FilePath, which is bucket-relative -- the
  # SECOND time this exact bug class has hit this file); GET /analyses/{id}/
  # plots 500'd unconditionally for every Ray/K8s analysis (no S3-backed
  # implementation existed at all). Also clarifies the #283 409's message
  # (the analysis id is a separate id space from the simulation id).
  # 0.9.81 (PR #361, item 98): adds simulator_id/document/compute_backend to
  # the /compose/v1 endpoints. simulator_id resolves through the existing
  # SimulatorVersion.git_commit_hash registry and threads into image/cache
  # selection (reuses SimulationServiceRay._image_uri verbatim); a new
  # POST /compose/v1/simulation/run-document accepts an inline JSON document
  # instead of a multipart upload; compute_backend picks a registered backend
  # explicitly (400s loud if unregistered, no silent fallback). All 3 params
  # are optional -- unset, behavior is byte-for-byte what 0.9.80 already did.
  - name: ghcr.io/vivarium-collective/sms-api
    newTag: 0.9.84
  # ptools 0.5.9 -> 0.9.53 (DEV ONLY — prod sms-api-stanford stays on 0.5.9 while
  # this soaks). The long-standing 0.5.9 pin existed because CI builds only
  # sms-api (scripts/build_action.sh), so no newer sms-ptools existed on ghcr.io
  # to point at. That is no longer true: 0.9.53 was built and pushed by hand via
  # `kustomize/scripts/build_and_push.sh` (docker buildx, linux/amd64).
  #
  # This is NOT a version-number-only rebuild. 0.5.9 was built from the 30.0
  # PREVIEW archive, which shipped 30.0 Pathway Tools binaries over 29.5 PGDB
  # data (aic-export/pgdbs/biocyc/{ecocyc,metacyc,mg1655-with-re548viocyc}/29.5).
  # 0.9.53 is built from the official release, aic-export-30.0.tar.gz, which
  # carries those three PGDBs at 30.0 and adds a fourth, mg1655-rph-vio-m5cyc at
  # 30.5. (The preview has been kept as aic-export.30.0-20260111.tar.gz; the ADD
  # in Dockerfile-ptools follows the dot -> dash rename of the release.)
  #
  # So the BioCyc data served on :1555 genuinely changes with this bump -- the
  # Lisp runtime image moves 1.232 -> 1.241 GB and 83 of 1998 common files
  # differ. Exercise the pbg-ptools viewer and any BioCyc-backed paths here
  # before promoting to prod. See commit bad12adb for the full archive diff.
  #
  # ptools is now tagged off the sms-api version line (whatever version.py read
  # when it was rebuilt) instead of versioning independently. It therefore LAGS
  # sms-api between rebuilds -- 0.9.53 is this build; sms-api has since moved to
  # 0.9.55 on its own. Tag the next ptools rebuild with version.py as of then;
  # do not bump this tag without actually building and pushing that image.
  - name: ghcr.io/vivarium-collective/sms-ptools
    newTag: 0.9.53
  # vivarium-workbench: published by cutting a GitHub Release in the workbench
  # repo (build-and-push.yml → ghcr:<version>); pin that release tag here.
  # 0.3.0 builds on the 0.2.0 demo-migration release (workbench PR #453 + #466:
  # v2ecoli dashboard demo migrated into the workbench repo — pinned-build remote
  # runs, CSRF allowlist + reverse-proxy support, /reports/ + study-detail base-path
  # fixes, composite-resolve graceful degradation, pbg-ptools viewer against
  # decoupled v2ecoli) and adds the pinned-run progress bar (#467) + report-rendering
  # fixes for the v4 study renderer and PR-attached reports (#468/#470). 0.3.1 adds
  # the bigraph-loom base-path fix (workbench #476): the wiring explorer's "test run"
  # posted a root-absolute /api/composite-test-run, which escaped the /workbench
  # prefix and matched the ALB's /api/* rule -> routed to sms-api, 404. The env this
  # image needs (allowed-origins / REMOTE_PINNED / DASHBOARD_PUBLIC_BASE_URL) is set
  # on the workbench Deployment below.
  #
  # 0.3.2 (DEV ONLY — prod stays 0.3.1 while this soaks) vendors bigraph-loom into
  # the workbench (dropping the git dep), reworks the emitter path (Explorer honors a
  # generator's declared Parquet, records emitter kind, live sqlite Results) and
  # builds _dist into the wheel. NOTE it does NOT contain deployment-target execution
  # — at tag b814ef8 run_core.invoke_run still raises RunTargetUnavailable (SP-D) and
  # composite_test_run_views still calls it without target=, so the UI cannot yet
  # dispatch a remote run. That needs a later release.
  #
  # Caveat worth knowing when rebuilding: the workbench Dockerfile's V2ECOLI_REF (and
  # PBG_PTOOLS_REF) default to "main" and the build workflow passes no build-args, so
  # a rebuild bakes whatever v2ecoli main points at. 0.3.2 baked the correct
  # a08e20bd… only because main still sits there; that agreement is not enforced.
  # 0.3.52 (workbench #915, item 78, Arnab): _session_workspace_mw no longer
  # re-stamps the shared vw_session cookie to match a header-less request --
  # it mints the cookie only when absent. Fixes a real cross-tab bug where an
  # unrelated tab's incidental fetch could silently repoint another tab's
  # next plain reload at the wrong workspace. Workbench-only change -- no
  # viva-api/scheduler/dispatch code touched. Built via the same
  # native-AMD64 Batch DinD infra as prior releases, from merged main
  # (d0c5d90f).
  # 0.3.54 (workbench PR #929, item 86, pre-merge live e2e verification): new
  # "external config" JSON-panel input mode alongside the per-field parameter
  # form. Deployed here BEFORE merge specifically to prove it live against
  # real workspace data, per this project's standing requirement -- built
  # off branch feat/item86-json-composite-panel@5c463b32, not yet on main.
  # SUPERSEDED same day: a real screenshot verification (this project's own
  # standing rule -- never trust DOM/curl alone for UI) found the panel was
  # added to dead code (composite-card.js's configBody, unreachable once
  # Configure/Inputs/Run/Outputs moved fully into the embedded bigraph-loom
  # component) -- see 0.3.55.
  # 0.3.55 (same PR, same-day fix, commit 31548170): relocates the panel to
  # the real live component, vivarium_workbench/loom/src/panels/
  # ConfigPanel.tsx (+ src/api.ts's translateExternalConfig) -- confirmed via
  # a fresh real screenshot this time. Also removes a broken "Save as
  # baseline" button the first pass added to study-detail.js: it queried DOM
  # elements that, now confirmed, live inside a cross-document iframe the
  # outer page can't see, so it would have always saved an empty {} over a
  # real baseline entry's params -- caught before merge, not shipped.
  # 0.3.56 (workbench #932 + #471 phase 1): the FIRST slim workbench image. It
  # no longer installs itself into v2ecoli's venv, so it carries no workspace
  # package and no science stack -- 15.3 GB -> 3.18 GB, and it builds on Apple
  # Silicon at all (the old build imported polars, which needs AVX that QEMU
  # cannot emulate, and pulled a base from a GovCloud ECR repo no CI credential
  # can reach).
  #
  # DEPLOYER-RELEVANT: <workspace>/.venv is now REQUIRED, not incidental.
  # EnvironmentResolver already sent every env worker there, but a workspace
  # without one used to fall back to the baked venv that happened to carry the
  # full stack. The image sets VIVARIUM_WORKBENCH_REQUIRE_WORKSPACE_VENV=1, so
  # that case now fails loudly at the seam instead of as a confusing
  # ModuleNotFoundError deep inside a worker call.
  #
  # Pre-flight against the live PVC before this bump: /workspace/.venv/bin/python
  # present + executable, Python 3.12.12, `import v2ecoli` OK inside it, 7.2 GB.
  # That is the whole dependency this image adds, and it is satisfied here.
  #
  # Also brings lib/deploy_config.py -- the ui.* deployment-config resolver this
  # namespace already mounts a ConfigMap for (see the VIVARIUM_WORKBENCH_DEPLOY_
  # CONFIG patch below). Phase 2 was inert precisely because the running image
  # predated the resolver; from this tag on, the mount is actually read.
  # 0.3.57 fixes a regression 0.3.56 introduced HERE (workbench #936): switching
  # the active workspace to a materialized build raised "workspace has no .venv"
  # for everything under build-cache/. materialize_build() extracts a tarball and
  # never provisions an environment, so no such workspace has one; before the
  # slim image they silently borrowed the baked science venv via sys.executable.
  # 0.3.57 borrows the BASE workspace's venv instead -- deliberate rather than
  # accidental. Bridge only; workbench #937 tracks per-workspace venvs.
  # 0.3.58 (workbench #945 + #946): the dial-back env-worker transport and the
  # remote EnvironmentResolver. Dev needs BOTH halves of this tag — it runs the
  # workbench that launches remote workers, AND it is the image an env-worker Job
  # stages its worker module from (ENV_WORKER_MODULE_IMAGE in shared.env).
  # Verified inside the image: env_worker.py offers (--socket-fd | --connect-to);
  # 0.3.57 and earlier offer only --socket-fd.
  # 0.3.65: live on this namespace per a real pod check (jschaff's own rapid
  # env-worker deploy loop, PRs #289-298) -- his own deploy-record PR for this
  # bump not yet merged as of this edit. Courtesy-corrected here only so THIS
  # unrelated sms-api bump (v0.9.61) doesn't downgrade it; not this session's
  # own change to author a changelog entry for.
  - name: ghcr.io/vivarium-collective/vivarium-workbench
    newTag: 0.3.78

replicas:
  - count: 1
    name: api
  - count: 1
    name: ptools
  # Single writer: workbench holds a git working copy + SQLite on an RWO EBS volume.
  # Pinned here explicitly (not just inherited from base/workbench.yaml) so the count
  # lives alongside every other deployment's.
  - count: 1
    name: workbench
  - count: 0
    name: redis
  - count: 0
    name: haproxy-ssh

resources:
#  - ingress.yaml
  - target-group-binding.yaml # to accept traffic from predefined ALB rather than use an ingres
  - secret-ghcr.yaml
  - secret-shared.yaml
  # vivarium-workbench: peer Deployment+Service (base/workbench.yaml is referenced
  # directly, NOT via base/kustomization.yaml, so it deploys ONLY on Stanford) +
  # its EBS PVC. Its TargetGroupBinding is in target-group-binding.yaml above.
  - ../../base/workbench
  - workbench-pvc.yaml
  - ../../config/sms-api-stanford-test
  - ../../base

patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws-us-gov:iam::476270107793:role/smsvpctest-batch-BatchSubmitIrsaRole31BE49CD-xETZl8o1n6cE
    target:
      kind: ServiceAccount
      name: batch-submit
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: api
  # Remove SLURM/SSH infrastructure from base api.yaml — stanford-test uses
  # K8s/AWS Batch exclusively.  Order: highest index first so removals don't
  # shift the indices of subsequent operations.
  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/5
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/2
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/2
      - op: remove
        path: /spec/template/spec/volumes/1
      - op: remove
        path: /spec/template/spec/volumes/0
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ghcr-secret
          mountPath: /run/secrets/ghcr
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ghcr-secret
          secret:
            secretName: ghcr-secret
            defaultMode: 256
    target:
      kind: Deployment
      name: api
  # ui.* deployment bindings: NOT patched here any more (vivarium-workbench#471
  # phase 4). This overlay used to patch PTOOLS_SERVER_URL and
  # DASHBOARD_PUBLIC_BASE_URL onto the seed-workspace initContainer, which made it
  # rewrite the served /workspace/workspace.yaml on every pod start -- stamping this
  # site's identity into a file that is git-TRACKED in the science repo (v2ecoli,
  # sms-ecoli). Those two values now come from the workbench-deploy-config ConfigMap
  # below, which the workbench reads at request time instead (>=0.3.56's
  # lib/deploy_config.py; this namespace runs 0.3.57).
  #
  # Deleting the patch is all phase 4 needs HERE. The base's mutations are
  # env-gated and default to "" ("empty = leave the workspace untouched"), so with
  # no patch supplying values they simply never fire -- the initContainer is back to
  # doing one job, seeding. The base code is deliberately left in place because
  # ../sms-api-stanford still patches it: prod has no deploy-config ConfigMap and
  # runs a workbench older than the resolver, so removing the base code would
  # silently kill prod's Omics Viewer (it self-gates -- no error, the button just
  # stops rendering). Phase 4 completes when prod migrates: delete its patch too,
  # then the now-dead base code.
  # Env workers: run a simulator's prebuilt image as the env worker
  # (vivarium-workbench#942 / REFACTOR-PLAN §2A.8). Declaring where workers dial
  # back is what SELECTS the remote launcher — the workbench's composition root
  # (lib/env_worker_launcher.default_launcher) goes remote iff this is set, and
  # local otherwise, because a laptop has no cluster. One deployment-wide
  # decision, chosen by topology rather than by any call site.
  #
  # The value is this pod's own IP via the Downward API: the worker connects
  # BACK to us. viva-api may create Jobs but not Services, so a worker pod has
  # no stable DNS name to dial, and the reverse direction also means viva-api
  # needs to discover nothing — we already know our own address.
  #
  # DEV ONLY for now: prod runs a workbench predating the transport, and
  # ../sms-api-stanford-workbench does not set this, so prod stays local.
  #
  # RELAY (plan §C, viva-api#309 + workbench#982): PROXY_BASE selects a third
  # transport in which viva-api holds the worker socket and the workbench
  # reaches it over HTTP. It exists for the case dial-back structurally cannot
  # serve -- a laptop, whose SSM tunnel is laptop-initiated with no inbound path
  # -- and dev is where it gets exercised before anyone depends on it.
  #
  # ADVERTISE_HOST below is left set ON PURPOSE. default_launcher checks
  # PROXY_BASE first, so it is inert while the relay is on, and rollback is then
  # the removal of ONE line rather than a restoration of two. (The precedence is
  # not incidental: a leftover ADVERTISE_HOST shadowing PROXY_BASE would present
  # as a worker that hangs, not as a misconfiguration, so it is pinned by
  # tests/test_proxy_worker_launcher.py.)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: VIVARIUM_WORKBENCH_ENV_WORKER_ADVERTISE_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: VIVARIUM_WORKBENCH_ENV_WORKER_PROXY_BASE
                    value: http://api:8000
    target:
      kind: Deployment
      name: workbench
  # The api side of the same switch. viva-api binds the dial-back listener now,
  # so the worker connects to THIS pod; the value is its own IP via the Downward
  # API for exactly the reason the workbench's was -- viva-api may create Jobs
  # but not Services, so a worker has no stable name to dial and the connection
  # has to run the other way.
  #
  # Absent, the relay endpoints 503 and nothing else changes. That is what let
  # viva-api#309 ship and deploy inert, ahead of this.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: ENV_WORKER_RELAY_ADVERTISE_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  # Caller identity (viva_api/api/auth.py). NAMES a header; it
                  # does NOT authenticate. Nothing in front of this deployment
                  # sets X-Auth-Request-Email today, so anyone may claim any
                  # value -- which is the honest description of what this buys:
                  # attribution, and one accident-prevention rule (you cannot
                  # cancel a task you did not start). It is not a boundary, and
                  # the day something here needs to be a boundary this variable
                  # is not what makes it one.
                  #
                  # Chosen because it is what oauth2-proxy sets, so a future
                  # proxy in front needs no change here. Unset elsewhere: prod
                  # and the UConn sites stay anonymous, which is their current
                  # behaviour exactly.
                  #
                  # Rollback is deleting these two lines; every endpoint then
                  # behaves as it did, and tasks record created_by = NULL.
                  - name: IDENTITY_HEADER
                    value: X-Auth-Request-Email
    target:
      kind: Deployment
      name: api
  # ui.* deployment-config layer (vivarium-workbench#471), phase 2 of lifting
  # these bindings out of the workspace. Mounts the generated
  # workbench-deploy-config ConfigMap read-only and names it via
  # VIVARIUM_WORKBENCH_DEPLOY_CONFIG; the workbench overlays it on top of the
  # served workspace.yaml's ui: block (deployment wins, null unsets).
  #
  # DOUBLY INERT ON PURPOSE. (1) Every value in workbench-deploy.yaml is exactly
  # what the seed initContainer above already stamps into workspace.yaml, so the
  # two agree and nothing changes. (2) The running workbench image predates
  # lib/deploy_config.py, so it ignores the env var and the mount entirely. This
  # existed to prove the plumbing before anything depended on it. As of phase 4
  # (the deleted patch above) it IS the only source for this namespace.
  #
  # Applied to the -test overlay only. The base is shared with sms-api-stanford,
  # where this ConfigMap does not exist -- putting the volume in the base would
  # either wedge prod's pod on a missing ConfigMap or force a prod rollout.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: VIVARIUM_WORKBENCH_DEPLOY_CONFIG
                    value: /etc/vivarium-workbench/deploy.yaml
                volumeMounts:
                  - name: deploy-config
                    mountPath: /etc/vivarium-workbench
                    readOnly: true
            volumes:
              - name: deploy-config
                configMap:
                  name: workbench-deploy-config
    target:
      kind: Deployment
      name: workbench
