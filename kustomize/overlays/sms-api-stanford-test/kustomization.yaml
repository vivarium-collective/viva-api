    # 2026-09-09: 0.9.131 -> 0.9.132, viva-api#558 -- _submit_multi_node_composite
    # now stages each seed_overrides[*].cache_dir S3 prefix under the dispatch's
    # own cache_s3 (server-side copy under a _seed_overrides/<seed>/ subpath),
    # then rewrites the override to the local path it resolves to via the
    # EXISTING recursive stage_s3->stage_dir sync -- no new env var, no
    # entrypoint change, no image rebuild. Real bug (item 106): a raw s3://
    # override URI was passed straight through to v2ecoli's plain
    # os.path.exists() cache check, unconditionally failing regardless of
    # whether the object existed -- confirmed on 2 real dispatches (733/738),
    # each failing on a different seed. Staging runs AFTER the cache_variant
    # existence guard (a real ordering bug found in review, fixed before merge)
    # so it can't mask a genuinely-unbuilt chassis.
    # 2026-09-09: 0.9.130 -> 0.9.131, viva-api#550 -- _lineage_generation_duration_total
    # now also reads BatchBaselineRunner's own batch.wall_s, not just
    # summary.generations[].duration. Found live firing 0.9.130 itself: Dispatch
    # 736:Run 3 seed0 -- the emit-gate fix (#543) worked, but execution then
    # reached a DIFFERENT, previously-masked gate (_assert_run_advanced /
    # PBG_MIN_GLOBAL_TIME) and still failed ("advanced only 1.0 of simulated
    # time") despite a real division at t=2528s (final_state.json's own
    # batch.wall_s == 2528.0). Never visible before 0.9.130, since the emit-gate
    # always failed first for this exact dispatch shape.
    # 2026-09-09: 0.9.129 -> 0.9.130, viva-api#543 -- _assert_emitted_output now
    # also cross-checks each file-backed emitter's own pre-redirect S3 location,
    # not just RAY_OUT_S3 (MNP-only, never set for chain-dispatch). Found live:
    # Dispatch 727:Run 3 seed0 genuinely succeeded (a real division, a real
    # checkpoint, ~360MB of real parquet history in S3) but was reported a hard
    # failure -- LineageProcess's own per-generation parquet emitter writes
    # straight to its original pre-redirect S3 destination (a plain config value
    # on a local:LineageProcess node _redirect_emitters never touches), with no
    # cross-check previously available for that dispatch shape at all. Purely
    # additive; the proven RAY_OUT_S3/MNP path (#520) is unchanged.
    # 2026-09-09: 0.9.128 -> 0.9.129, viva-api#536 -- _check_required_run_interval
