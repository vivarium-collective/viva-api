# vivarium-workbench's own ServiceAccount (sms-api-stanford-test only).
#
# The workbench serves a remote analysis's rendered figures and ptools tables straight
# from S3 (vivarium-workbench#1072/#1078). As SA `default` the pod had no AWS identity,
# so those reads worked only from a laptop holding GovCloud SSO creds. This SA carries
# the READ-ONLY IRSA role sms-cdk's BatchStack creates for it (list + get on the shared
# bucket; no write, no delete). The role name is stable, set by sms-cdk config
# `batch.irsaWorkbenchServiceAccount` for prefix `smsvpctest`.
#
# Deploy order: `cdk deploy smsvpctest-batch` FIRST (the role must exist), then apply
# this overlay and restart the workbench so the pod picks up the projected token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workbench
  annotations:
    eks.amazonaws.com/role-arn: arn:aws-us-gov:iam::476270107793:role/smsvpctest-workbench-s3-read
