apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford-test

images:
  - name: ghcr.io/vivarium-collective/sms-api
    # Must contain viva_api/simulation/db_reconcile.py (the Job runs it) AND every
    # migration the deployed app expects. Keep in sync with the app overlay's
    # sms-api tag; do not lower below 0.9.19. The Job only applies what THIS tag
    # contains, so a stale tag here silently skips migrations -- the Job still
    # reports success. See the sms-api-stanford sibling for the production
    # incident this caused on 2026-08-19.
    #
    # 2026-08-24: 0.9.26 -> 0.9.55, matching this overlay's app tag. The last Job
    # run here was from an ad-hoc 0.9.52 override rather than this pin, which is
    # exactly the drift the sync contract exists to prevent.
    # 2026-08-25: 0.9.55 -> 0.9.56, matching the app overlay bump (item 88's
    # multi_node_composite_id migration, 9c2e6b1f4a73) -- the app was deployed
    # slightly ahead of this Job (real, caught live via UndefinedColumnError
    # spam in the api pod's own logs, fixed the same few minutes).
    newTag: 0.9.90
    # 2026-09-03: 0.9.89 -> 0.9.90, matching the app overlay bump (item 109/111's
    # pbg-native analysis-mechanism gap fix, PR#390 -- no new Alembic migration
    # this release either, a handler-logic-only change).
    # 2026-09-03: 0.9.87 -> 0.9.88, matching the app overlay bump (item 105's
    # run_new_gene_cache precondition-removal fix, PR#380 -- no new Alembic
    # migration this release either, a handler-logic-only change).
    # 2026-09-03: 0.9.86 -> 0.9.87, matching the app overlay bump (item 105's
    # build_new_gene_cache.py remote-reachability fix, PR#378 -- no new
    # Alembic migration this release either, no schema change).
    # 2026-09-03: 0.9.85 -> 0.9.86, matching the app overlay bump (item 105's
    # composite_id caller-selectable fix, PR#376 -- no new Alembic migration
    # this release either, pure extra="allow" passthrough field).
    # 2026-09-02: 0.9.84 -> 0.9.85, matching the app overlay bump (item 101's
    # _mnp_node_vcpus retry-with-backoff fix -- no new Alembic migration this
    # release either, PR#372 only touched simulation_service_ray.py + tests).
    # 2026-09-02: 0.9.83 -> 0.9.84, matching the app overlay bump (item 103's
    # stop_at_division chain-dispatch fix -- no new Alembic migration this
    # release, kept in sync per the version-sync checklist).
    # 2026-09-02: 0.9.82 -> 0.9.83, matching the app overlay bump (item 104's
    # ParCa bundle_overrides passthrough fix -- no new Alembic migration this
    # release, kept in sync per the version-sync checklist).
    # 2026-09-02: 0.9.80 -> 0.9.82, matching the app overlay bump (item 102's
    # num_nodes field on ComposeSimulationRequest/ComposeDocumentSubmission --
    # no new Alembic migration this release, kept in sync per the version-sync
    # checklist's own "keep it equal" rule).
    # 2026-09-01: 0.9.78 -> 0.9.79, matching the app overlay bump (item 93's
    # chain-dispatch config passthrough -- no new Alembic migration this release,
    # kept in sync per the version-sync checklist's own "keep it equal" rule).
    # 2026-09-01: 0.9.79 -> 0.9.80, same reason -- item 93's PYTHONPATH fix
    # (viva-api PR #359), no new Alembic migration this release either.
    # 0.9.60 -> 0.9.63: this pin had drifted THREE releases behind the app, which
    # is the exact failure docs/DEPLOY.md and CLAUDE.md's version-sync checklist
    # warn about -- the Job runs the reconciler from THIS image, so it can only
    # apply migrations the image contains. 0.9.63 is the first image containing
    # b4d7e9c02a15 (env_worker_task); running the Job at 0.9.60 would have
    # reported success having applied nothing, and the app would then have
    # started against a database with no such table.

resources:
  - alembic-job.yaml
  - secret-shared.yaml
  - secret-ghcr.yaml
  - ../../config/sms-api-stanford-test
