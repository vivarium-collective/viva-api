apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford-test

images:
  - name: ghcr.io/vivarium-collective/sms-api
    # Must contain viva_api/simulation/db_reconcile.py (the Job runs it) AND every
    # migration the deployed app expects. Keep in sync with the app overlay's
    # sms-api tag; do not lower below 0.9.19. The Job only applies what THIS tag
    # contains, so a stale tag here silently skips migrations -- the Job still
    # reports success. See the sms-api-stanford sibling for the production
    # incident this caused on 2026-08-19.
    #
    # 2026-08-24: 0.9.26 -> 0.9.55, matching this overlay's app tag. The last Job
    # run here was from an ad-hoc 0.9.52 override rather than this pin, which is
    # exactly the drift the sync contract exists to prevent.
    # 2026-08-25: 0.9.55 -> 0.9.56, matching the app overlay bump (item 88's
    # multi_node_composite_id migration, 9c2e6b1f4a73) -- the app was deployed
    # slightly ahead of this Job (real, caught live via UndefinedColumnError
    # spam in the api pod's own logs, fixed the same few minutes).
    newTag: 0.9.56

resources:
  - alembic-job.yaml
  - secret-shared.yaml
  - secret-ghcr.yaml
  - ../../config/sms-api-stanford-test
