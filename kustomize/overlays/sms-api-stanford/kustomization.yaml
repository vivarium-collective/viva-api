apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford

# cd1 release version of api (as given to PNNL):
# - name: ghcr.io/vivarium-collective/sms-api
#   newTag: 0.4.5

# vivarium-workbench's Deployment/Service/PVC/TargetGroupBinding/image moved to
# the sibling ../sms-api-stanford-workbench overlay (backlog item 21) so an
# api-only apply here can never touch -- and, since base/workbench.yaml is
# `strategy: Recreate`, can never recreate and silently wipe -- the workbench
# pod's ephemeral session state (build-cache, in-progress unpushed git working
# copies). A full namespace redeploy applies both overlays; see that overlay's
# kustomization.yaml for the full rationale.

images:
  # 0.9.28: routes standalone analysis to a v2ecoli-native K8s job for
  # Ray-backend simulators (v2ecoli/sms-ecoli) instead of the legacy
  # vEcoli-private/Nextflow path, which pulled an image never produced for
  # this pipeline (confirmed live via ImagePullBackOff) -- the 14th-bug fix.
  # Also fixes a K8s job-name collision on repeat analysis triggers and wires
  # real DB-tracked status (GET /analyses/{id}/status) for these jobs.
  # 0.9.29: routes to a real multi-generation LineageProcess/batch_baseline_runner
  # dispatch (scripts/run_batch_baseline_ray.py) when a simulation requests
  # generations > 1 -- the default single-generation script silently ignored
  # this entirely. First real dispatch of this pipeline on any infrastructure.
  # 0.9.30: sets V2ECOLI_SIM_DATA on submit_ray_native_analysis()'s K8s Job spec
  # (gap #1) so the DuckDB/cd1 analysis suite can resolve sim_data for an S3
  # sweep -- required for the cd1 (base/vio/mec) reproduction via sms-ecoli.
  # 0.9.32: fixes _run_standalone_analysis_ray_native's config missing
  # analysis_options (ORMAnalysis.to_dto() unconditionally reads it) -- every
  # GET /analyses/{id} for a Ray-native analysis 500'd with a raw KeyError.
  # 0.9.33: fixes run_standalone_analysis()'s default ptools_* modules being
  # nested under "multiseed" when they're registered scale="single" -- every
  # default-modules (--modules omitted) analysis dispatch failed at the
  # analysis-runner boundary (live-reproduced against sim db id 125, 5 failed
  # K8s Job attempts over 22h before root-caused).
  # 0.9.36 (backlog items 26/27, #221): the multi-generation batch dispatch no
  # longer shells out to the hardcoded scripts/run_batch_baseline_ray.py -- it
  # stages the same generic run_pbg.py runner the /compose/v1 path already uses
  # and dispatches a registered composite through it instead. Also fixes the
  # multi-gen dispatch never threading the request's real experiment_id through
  # (every batch's output was silently stamped "batch_baseline" regardless of
  # what was actually requested). Supersedes 0.9.34/0.9.35, whose own tags were
  # never cut on this branch at release time -- a real gap, not a skip.
  # 0.9.37 (#223): fixes V2ECOLI_BASELINE_COMPOSITE_ID, which was missing the
  # trailing ".ecoli_baseline" that process_bigraph.composite_spec's own
  # f"{fn.__module__}.{name}" id scheme requires -- every real 0.9.36 multi-gen
  # dispatch failed with "no composite registered as
  # 'v2ecoli.composites.ecoli_baseline'", caught by a live pilot dispatch
  # against this exact deployment (2026-08-06), never caught by unit tests
  # (they mock the whole registry).
  # 0.9.38: 0.9.37 was STILL wrong -- a second real pilot dispatch failed
  # identically with the now-correctly-shaped id. Root cause: "ecoli_baseline"
  # does not exist anywhere in sms-ecoli (confirmed via git show/git grep
  # directly against the deployed commit e38f742) -- it's only real in the
  # separate, unsynced v2ecoli repo. The real composite is sms-ecoli's own
  # v2ecoli/composites/batch_baseline.py (name="batch_baseline"). Renamed the
  # constant to V2ECOLI_BATCH_BASELINE_COMPOSITE_ID = "v2ecoli.composites.
  # batch_baseline.batch_baseline".
  # 0.9.39 (#226): Array-jobs-for-canonical dispatch -- batch_baseline multiseed x
  # multigeneration sweeps (n_seeds>1, n_generations>1, no composite override) now
  # submit as an AWS Batch Array job (N independent single-seed children) instead of
  # an MNP Ray cluster. Ray-MNP unchanged for ParCa, phase0/comparison-ensemble, and
  # colonies. Needs the new RAY_ARRAY_QUEUE/RAY_ARRAY_JOB_DEFINITION shared.env values
  # (smscdk-ray-batch stack's RayArrayJobDef, sms-cdk PR #33, deployed same session).
  # 0.9.40 (#229): fix _submit_array's dependsOn -- real AWS Batch rejected
  # {"jobId": ..., "type": "SEQUENTIAL"} for a job that also sets arrayProperties
  # ("Job Id cannot be set when dependency type is SEQUENTIAL"), caught by the first
  # real Array-jobs pilot dispatch. Now a plain {"jobId": ...} dependency.
  # 0.9.41 (#231, #227): auto-triggers analysis as a 3rd node in the same Batch
  # dependsOn DAG already used for parca->sim (item 24) instead of composite-Step
  # wiring, which is structurally wrong for the array/scatter shape (each child only
  # sees 1/N of the sweep) -- reuses the existing S3-native run_standalone_analysis.py
  # entrypoint. Also splits the workbench Deployment out of this overlay into the
  # sibling ../sms-api-stanford-workbench overlay (item 21) and completes the
  # sms_api -> viva_api package rename (main/deploy-trunk reunified, #232/#233).
  # 0.9.42 (#237): per-seed job chain dispatch replaces AWS Batch array jobs for
  # simulation dispatch (item 33) -- each seed's generations run as their own
  # sequentially-dependent chain instead of sharing one array job, removing the
  # >=2-seed array floor and letting a campaign resume per-seed. get_simulation_status
  # made chain-campaign-aware (item 14). Real-AWS-verified fix for the analysis-stage
  # OOM (item 38): AnalysisOptions.memory_gb config knob + the new r7i.4xlarge/128GiB
  # Ray-MNP compute environment (sms-cdk) together let the pilot-scale analysis
  # complete without the OOM-kill the original bug had (job f87c7d34, exitCode 137).
  # 0.9.43 (#247, item 51): chain-dispatch campaign submission now runs in the
  # background (LocalTaskService) instead of blocking the HTTP response on the full
  # campaign-size submission loop -- a 1000x10 campaign's ~15min submission loop
  # exceeded the calling client's 30s timeout, reporting a spurious failure while
  # the real dispatch kept running server-side (real incident, risked an accidental
  # duplicate campaign on retry).
  # 0.9.44 (#248, item 55): fixes V2ECOLI_BATCH_BASELINE_COMPOSITE_ID, stale after an
  # upstream v2ecoli composite refactor (v2ecoli #373, folded batch_baseline into
  # ecoli_baseline.py's baseline(), no legacy-id alias by design) finally synced into
  # sms-ecoli via PR #56 -- a real pilot dispatch (sim 152) failed both seeds at
  # generation 0 with "no composite registered as
  # v2ecoli.composites.batch_baseline.batch_baseline". New id verified directly
  # against the deployed image at the real built commit (c44b69a). Also renames
  # base_seed -> seed in the per-seed chain-dispatch overrides (a second real
  # incompatibility with the new composite's signature).
  # Catches up this overlay's newTag (last committed at 0.9.46) to match what's
  # actually being deployed now (0.9.55, backlog item 88) -- confirmed via
  # kubectl the real live tag was already drifted ahead to 0.9.53 (an earlier
  # deploy whose git tracking never caught up, same drift class already
  # documented on the -test overlay above).
  # 0.9.56 (item 86/88, PR #276): auto-triggers the analysis job once a
  # multi-node composite dispatch (e.g. colony) completes. Verified
  # line-by-line to never touch chain-dispatch code before deploying here.
  # 0.9.57 (PR #283): GET .../observables/index now returns a clear 409 for a
  # chain-dispatch campaign or multi-node composite instead of falling through
  # to a store neither shape ever writes. Already live-verified on smsvpctest
  # before promoting here.
  - name: ghcr.io/vivarium-collective/sms-api
    newTag: 0.9.78
  # ptools 0.5.9 -> 0.9.53, promoting to prod what has been running on
  # sms-api-stanford-test since 2026-08-24 (PR #266).
  #
  # The old 0.5.9 pin was never a stability choice -- CI builds only sms-api
  # (scripts/build_action.sh), so no newer sms-ptools existed on ghcr.io to point
  # at. 0.9.53 was built and pushed by hand via kustomize/scripts/build_and_push.sh
  # (docker buildx, linux/amd64); it exists on ghcr, so this will not ErrImagePull.
  #
  # THIS CHANGES THE BIOCYC DATA SERVED ON :1555 -- it is not a version-number-only
  # rebuild. 0.5.9 was built from the Pathway Tools 30.0 PREVIEW archive, which
  # shipped 30.0 binaries over 29.5 PGDB data. 0.9.53 is built from the official
  # release (aic-export-30.0.tar.gz): ecocyc/metacyc/mg1655-with-re548viocyc move
  # 29.5 -> 30.0, and a fourth PGDB, mg1655-rph-vio-m5cyc/30.5, is added. The Lisp
  # runtime image moves 1.232 -> 1.241 GB; 83 of 1998 common files differ. See
  # commit bad12adb for the full archive diff.
  #
  # Verified live on stanford-test before promoting: GET / -> 200, and
  # organism-summary -> 200 for ECOLI ("version 30.0", was 29.5), for
  # MG1655-WITH-RE548VIO, and for the new MG1655-RPH-VIO-M5. The startup line
  # "There are 3 organisms available" is CORRECT and not a missing PGDB -- the
  # fourth is META (MetaCyc), a reference pathway DB rather than an organism, so
  # organism-summary?object=META legitimately 404s.
  #
  # NOTE: this Deployment has no readiness/liveness probe, so `kubectl rollout
  # status` reports success the instant the process starts and proves nothing.
  # Verify by port-forwarding :1555 and repeating the checks above.
  #
  # ptools is tagged off the sms-api version line as of its BUILD, so it lags
  # sms-api between rebuilds (api is 0.9.55 here). Never bump this tag without
  # actually building and pushing that image.
  - name: ghcr.io/vivarium-collective/sms-ptools
    newTag: 0.9.53

replicas:
  - count: 1
    name: api
  - count: 1
    name: ptools
  - count: 0
    name: redis
  - count: 0
    name: haproxy-ssh

resources:
#  - ingress.yaml
  - target-group-binding.yaml
  - secret-ghcr.yaml
  - secret-shared.yaml
  - ../../config/sms-api-stanford
  - ../../base

patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws-us-gov:iam::476270107793:role/smscdk-batch-BatchSubmitIrsaRole31BE49CD-vYkQKg5TNDXz
    target:
      kind: ServiceAccount
      name: batch-submit
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: api
  # Remove SLURM/SSH infrastructure from base api.yaml — stanford uses
  # K8s/AWS Batch exclusively.  Order: highest index first so removals don't
  # shift the indices of subsequent operations.
  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/5
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/2
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/2
      - op: remove
        path: /spec/template/spec/volumes/1
      - op: remove
        path: /spec/template/spec/volumes/0
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ghcr-secret
          mountPath: /run/secrets/ghcr
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ghcr-secret
          secret:
            secretName: ghcr-secret
            defaultMode: 256
    target:
      kind: Deployment
      name: api
  # Env workers (vivarium-workbench#942 / REFACTOR-PLAN 2A.8). The api relays a
  # worker's dial-back connection, so it must advertise a routable address for
  # itself: viva_api/api/routers/env_worker.py reads ENV_WORKER_RELAY_ADVERTISE_HOST
  # and app/cli.py errors out by name when it is unset. Pod IP rather than the
  # Service name because the worker connects back to THIS replica, not to a
  # load-balanced endpoint. Matches the sms-api-stanford-test overlay.
  #
  # Deliberately NOT copying that overlay's neighbouring IDENTITY_HEADER=X-Auth-
  # Request-Email: the value is already DEFAULT_IDENTITY_HEADER in
  # app/app_data_service.py, and the env var actually consulted there is
  # ATLANTIS_IDENTITY_HEADER -- so setting IDENTITY_HEADER changes nothing and is
  # unrelated to env workers.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: ENV_WORKER_RELAY_ADVERTISE_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
    target:
      kind: Deployment
      name: api
