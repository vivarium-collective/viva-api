apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford

images:
  - name: ghcr.io/vivarium-collective/sms-api
    # Must contain viva_api/simulation/db_reconcile.py (the Job runs it) AND every
    # migration the deployed app expects. Keep in sync with the app overlay's
    # sms-api tag; do not lower below 0.9.19.
    #
    # 0.9.42 -> 0.9.50: this pin had drifted 8 releases behind the live app and
    # left a REAL defect in production. Migration 44335812e447 (0.9.45) adds the
    # upper-case 'CANCELLED' value to the jobstatusdb enum; ORMHpcRun.status has
    # no values_callable, so SQLAlchemy binds the enum by NAME, and prod's enum
    # held only the lower-case 'cancelled' from a1c3e5f7b9d2. Every
    # POST /api/v1/simulations/{id}/cancel therefore raised
    # InvalidTextRepresentationError. Confirmed live 2026-08-19: app on 0.9.50,
    # alembic_version stuck at f2b8e4a6c9d1, reconciler reporting the
    # PENDING/CANCELLED marker absent, and the Job's last run 7d17h old --
    # re-running it at 0.9.42 would have applied nothing, because that image
    # does not contain the migration.
    newTag: 0.9.50

resources:
  - alembic-job.yaml
  - secret-shared.yaml
  - secret-ghcr.yaml
  - ../../config/sms-api-stanford
