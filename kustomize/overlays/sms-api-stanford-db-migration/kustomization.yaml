apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford

images:
  - name: ghcr.io/vivarium-collective/sms-api
    # This image must contain BOTH viva_api/simulation/db_reconcile.py (the Job
    # runs it) AND every migration the deployed app expects. Keep in sync with the
    # app overlay's sms-api tag; do not lower below 0.9.19.
    #
    # WHY THE SECOND HALF MATTERS -- a real production defect, 2026-08-19.
    # This pin sat at 0.9.42 while the app overlay moved on. Migration
    # 44335812e447 (shipped in 0.9.45) adds the upper-case 'CANCELLED' value to
    # the jobstatusdb enum. ORMHpcRun.status has no values_callable, so SQLAlchemy
    # binds the enum by NAME (upper-case), while prod's enum held only the
    # lower-case 'cancelled' added by a1c3e5f7b9d2. Every
    # POST /api/v1/simulations/{id}/cancel therefore raised
    # InvalidTextRepresentationError.
    #
    # The trap is that re-running the Job in a stale state fixes NOTHING -- the
    # pinned image does not contain the migration, so `upgrade head` has nothing
    # to apply. A stale pin here is SILENT: the Job succeeds and the schema stays
    # behind.
    #
    # 2026-08-24: unblocked and bumped 0.9.42 -> 0.9.55. The earlier note said this
    # could not be bumped because prod was running an image built from an unmerged
    # branch, so no correct main-based value existed. That is resolved: main is at
    # 0.9.55 and the live prod api Deployment runs 0.9.55, so the two agree again.
    # Verified before pinning -- the live 0.9.55 image carries all 9 revisions in
    # /app/alembic/versions (including head 71a5478673a8) plus db_reconcile.py, and
    # `db_reconcile --analyze` against prod RDS reports managed at 71a5478673a8 with
    # every schema marker present. This bump is therefore a no-op for the CURRENT
    # schema; its value is that the NEXT migration will actually be applied.
    newTag: 0.9.55

resources:
  - alembic-job.yaml
  - secret-shared.yaml
  - secret-ghcr.yaml
  - ../../config/sms-api-stanford
