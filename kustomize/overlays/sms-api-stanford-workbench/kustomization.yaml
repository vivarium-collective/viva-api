apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms-api-stanford

# vivarium-workbench Deployment + Service + PVC + TargetGroupBinding, split out
# of ../sms-api-stanford into its own independently-applicable kustomization
# (backlog item 21). Same namespace, same cluster, same live deployment --
# this is a pure resource-scope split, not a new environment.
#
# WHY: kustomize/base/workbench is `strategy: Recreate` (see base/workbench/
# workbench.yaml) and its session build-cache (~/.pbg/build-cache, including
# each session's own not-yet-pushed git working copy) lives on the pod's
# ephemeral filesystem, not the workbench-workspace PVC (confirmed via
# `kubectl get deploy workbench -o jsonpath='{.spec.template.spec.volumes}'`
# -- only `workspace` is mounted). Before this split, `kubectl apply -k
# overlays/sms-api-stanford` rendered EVERY resource in the namespace --
# api, ptools, redis, haproxy-ssh, AND workbench -- as one manifest set, so
# any apply that touched that combined kustomization.yaml (even a pure
# sms-api-only version bump living a few lines away in the same file) could
# recreate the workbench Deployment and silently wipe in-progress session
# state. This split narrows that blast radius: a viva-api-only change now
# renders and applies from ../sms-api-stanford alone, never touching this
# kustomization's resources. Item 21's other half -- the underlying
# ephemeral-cache defect itself (a legitimate workbench-image bump, node
# eviction, or OOM-kill wiping /root/.pbg/build-cache) -- is now closed in
# base/workbench/workbench.yaml: a second volumeMount of this SAME PVC
# (subPath: build-cache) makes that path durable too, matching this
# project's original intent (vivarium-workbench's docs/REFACTOR-PLAN.md
# §2B.3).
#
# Apply independently:
#   kubectl kustomize kustomize/overlays/sms-api-stanford-workbench | kubectl apply -f -
# A full-namespace redeploy applies both this and ../sms-api-stanford; deploying
# one does not require deploying the other.

images:
  # vivarium-workbench: pin the workbench GitHub Release tag (build-and-push.yml ->
  # ghcr:<version>). 0.3.0 = 0.2.0 demo-migration image + pinned-run progress bar
  # (#467) and report-rendering fixes (#468/#470). 0.3.1 adds the bigraph-loom
  # base-path fix (workbench #476): the wiring explorer's "test run" posted a
  # root-absolute /api/composite-test-run, which escaped the /workbench prefix and
  # matched the ALB's /api/* rule -> routed to sms-api, 404. (matches stanford-test).
  # 0.3.14 (workbench #658) applies the same fix to the main dashboard page's
  # session.js spawn-bind (the Source panel's "Open" button), which had the
  # identical late-shim-injection bug — found while trying to bind a session to
  # the sms-ecoli pilot build. 0.3.15 (workbench #659) fixes six more instances
  # of the same class of bug: the Viz/Report/Analyses/Results buttons and
  # study export/analysis-zip/audit-report links all build plain <a href>/
  # window.open()/window.location targets, which the base-path shim (patches
  # only fetch/XHR/EventSource) never sees. 0.3.16 (workbench #660) closes a
  # separate, non-transport gap: Results download now falls back to sms-api's
  # existing S3-streaming /data endpoint when a run's local materialization
  # is gone (the normal state for a GovCloud-dispatched run after a pod
  # restart, or one recorded via the sms-api-backed remote-simulations list).
  # 0.3.17 (workbench #661) fixes the reason a remote-dispatched run's
  # analysis_options always came out empty: remote_run_submit() never read
  # spec.analyses at all, for any run, ever — now threads
  # build_analysis_options(spec.analyses) into the dispatch payload.
  # 0.3.18 (workbench #662) adds zarr-native default Viz/Report rendering:
  # every GovCloud/Ray run's data lives in a zarr store, but neither the
  # framework's own render pipeline nor the external
  # viva_superpowers.TimeSeriesFromObservables class has ever had a
  # non-SQLite code path — new lib.zarr_default_viz renders real charts
  # directly from a run's zarr store instead. 0.3.19 (workbench #663) merges
  # remote sms-api builds into the top-left workspace-switcher dropdown
  # (previously reachable only through the separate Source panel). 0.3.20
  # (workbench #664) adds the study-analyses UI control + backend endpoint
  # that was still missing after 0.3.17: nothing could author spec.analyses
  # at all, even though the remote dispatch path already reads it correctly.
  # 0.3.21 (workbench #665) fixes study_create()'s no-source ("blank study")
  # branch: it scaffolded spec.yaml under studies/<name>/, but
  # iter_study_dirs() only recognizes study.yaml there (spec.yaml is legacy,
  # honored only under investigations/<name>/). Every blank study created via
  # the "+ Study" modal returned 200 yet was permanently invisible to
  # /api/investigations and /api/study/{slug} — found live on this deployment
  # while trying to author a study to attach analyses config to. 0.3.22
  # (workbench #666) fixes a stale vw_session cookie: it was only ever set
  # when absent, so a browser that already had a cookie from an earlier,
  # different session never converged to a later bind — fetch() calls
  # (session.js's X-VW-Session header) resolved correctly, but any plain
  # navigation (iframe, typed URL) fell back to the stale cookie and
  # silently loaded the wrong workspace. Found opening the study created
  # while fixing 0.3.21: the JSON API returned it, but the UI still said
  # "Study not found." 0.3.23 (workbench #667) moves the study-analyses
  # authoring control (from 0.3.20) off a legacy panel that no navigation
  # path actually opened — dead UI — onto the Study page's Model tab,
  # reachable for every study, grouped or ungrouped. 0.3.24 (workbench #669)
  # restores a UI path to set/replace a study's baseline composite ref —
  # the pre-unification "+ Add baseline" form was removed from the template
  # during the Model/Build panel merge, orphaning its JS handler and the
  # study-baseline-add/-remove endpoints; there was no way to fix a
  # "+ Study" blank scaffold's placeholder composite ref through the UI.
  # 0.3.25 (workbench #670) fixes the 0.3.24 control itself: it called
  # remove-then-add, but study_baseline_remove refuses to leave baseline[]
  # empty (400) — every single-entry study (any fresh blank scaffold) hit
  # that guard on the first call. Now adds the replacement under a new name
  # first, then removes the old one. 0.3.26 (workbench #671) fixes a
  # switched/materialized sms-api build (switch_build()'s tarball
  # extraction, deliberately not a git repo) never being able to dispatch:
  # the non-pinned "Run on remote" push-based path requires a real git
  # working copy with an origin remote. New ensure_git_workspace() makes
  # every switched build push-ready (git init + remote add + a commit
  # under a new workbench/sim<id>-<commit> branch) right at switch time,
  # self-healing on every switch since build-cache lives on ephemeral pod
  # storage. Also bumps the git-push timeout 120s -> 600s: a switched
  # build's first push carries the whole materialized tree as one
  # brand-new commit with no shared history with origin. 0.3.27
  # (workbench #674) fixes landing a multi-seed remote run: land_remote_run()
  # defaulted seed=0 and no caller ever overrode it, so every multi-seed
  # GovCloud run silently kept only its first seed on landing — found live
  # backlog-verifying a real dispatch (S3 confirmed both seeds computed
  # correctly and in parallel; only the local landing step dropped one).
  # Now unions every seed_NN/store.zarr found in the tar into one destination.
  # 0.3.28 (workbench #675): triggers standalone analysis on "Land Results"
  # when a study has spec.analyses configured, polls its real status (sms-api
  # 0.9.28's new endpoint) instead of a blind sleep, and folds the completed
  # result into .pbg/runs/<run_id>/analyses.json -- closing the loop through
  # the existing Analyses button with no frontend changes needed.
  # 0.3.29 (workbench #711): depends on viva-marketplace (ledger) so the
  # workbench reads the topic-discovered registry. Found live on prod
  # already running this tag with no matching bump here -- this file had
  # drifted from the real deployed state; re-syncing it now closes that gap
  # (a plain `kubectl apply` of the stale 0.3.28 pin would otherwise silently
  # roll the live workbench pod backward on the next unrelated deploy).
  # 0.3.32 (workbench #744): materialize_session_build preserves symlinks
  # instead of dereferencing them -- a dangling symlink anywhere in a
  # switched build's shared base (sms-ecoli's) was crashing every session
  # switch to it. Supersedes 0.3.30/0.3.31, deployed surgically without a
  # matching bump here at the time -- same drift pattern as 0.3.29 above.
  # 0.3.34 (workbench #747): "Run current spec" is now mode-aware -- on a
  # remote-pinned deployment (this one) it dispatches to AWS Batch via the
  # existing /api/remote-run-submit instead of always running locally. One
  # button, no new button; deployment mode decides the behavior.
  # 0.3.35 (workbench #748): baseline.step runs can expose a downloadable JSON
  # artifact under their run (analysis_out_dir injected into the Step's config,
  # .json allowed as an analysis-output extension scoped to files under
  # analyses/ so viewer/config packs are never surfaced as downloads).
  # 0.3.36 (workbench #749/#750): recognizes the native per-lineage zarr naming
  # (<experiment_id>_v<variant>_s<seed>.zarr) when landing a remote run,
  # alongside the existing seed_NN/store.zarr convention -- a batch dispatched
  # via the generic run_pbg.py runner (viva-api 0.9.36, same items 26/27) never
  # restructures into seed_NN/store.zarr, and every lineage in the batch shares
  # the same experiment_id=X/variant=Y prefix, so the prior top-level union
  # would have kept only the first-processed lineage -- same class of bug as
  # #674, recurring one level deeper. _merge_zarr_tree recurses into a
  # collision instead of skipping it, for both zarr conventions.
  # 0.3.37 (workbench #753/#755/#756/#757/#759): fixes investigations dir
  # resolution through WorkspacePaths in scaffold mutations (item 22 -- the
  # investigation 404 bug); adds a UI trigger (Analyses button) to run
  # analysis on an existing completed simulation instead of only at dispatch
  # time (item 23, pairs with viva-api 0.9.41's analysis-DAG-node); aligns
  # server-side canonical-run outcome resolution with the client's
  # canonical:-flag semantics instead of last-run-wins; and adds a read-only
  # GET /api/server-version endpoint so a published/readonly bundle can
  # report what it's actually running.
  # 0.3.40 (workbench #791/#793/#794/#795/#797, item 39; 0.3.38/0.3.39 were
  # never deployed here) closes out the workbench image's Fix B: the
  # Dockerfile stopped git-cloning a workspace repo at build time (0.3.38)
  # but couldn't actually build on Apple Silicon -- polars needs AVX2, which
  # QEMU/Rosetta cross-arch emulation can't execute, crashing `Illegal
  # instruction` even at import time. Extended the existing AWS Batch DooD
  # build mechanism (already used for v2ecoli's own images) for real amd64
  # compute instead; found+fixed 3 more real bugs live (stale sanity-check
  # import, Batch job-name dots, 4 missing git-sourced core deps the
  # workspace image's own build excludes). Also fixes analysis-name
  # translation for remote dispatch to resolve against the live served
  # workspace instead of a build-time-baked snapshot (#791). First image
  # built via this path, independently verified live on ghcr.io.
  # 0.3.47 (workbench #257 backend already deployed via sms-api 0.9.50; this
  # tag ships the matching frontend halves): item 6's real per-seed progress
  # bar (PR #853, polls the new /simulations/{id}/chain-progress endpoint) and
  # item 63's composite-parameter-discovery fix for session-pinned remote
  # builds (PR #852, 3 compounding root causes in switch_build's env
  # materialization + composite_resolve's routing + the local generator
  # lookup's in-process-import gap). Built via sms-cdk's native-AMD64 Batch
  # DinD infra (same mechanism 0.3.40 used) from the clean v0.3.47 git tag,
  # not a local build -- QEMU/Polars emulation crashes on Apple Silicon never
  # applied. First image built this way to land here since 0.3.40.
  # 0.3.48 (workbench #917, item 80/83): two dispatch-config-building bugs
  # found live during a real UI-triggered 1000x10 baseline dispatch on this
  # deployment. (1) study_crud_mutations.py's study_baseline_add/_remove
  # operated on the raw on-disk study YAML while a v4 (conditions-based)
  # study's baseline[] is only ever a synthesized, never-persisted in-memory
  # view (investigations._project_v4_redesign_to_legacy_view) -- editing
  # Runnable-models params on such a study silently created a disconnected
  # real baseline: key, then 404'd trying to remove the phantom old one. New
  # _v4_baseline_not_yet_materialized() guard now returns a clear 422 instead.
  # (2) study_spec.collect_study_observables() accepted any non-empty string
  # under a behavior_tests[*].measure.path key, including one study's
  # data-authoring defect (a division expression stored directly under path
  # instead of the sibling formula field) -- silently corrupted
  # engine_process_reports for that dispatch. New _OBSERVABLE_SEGMENT_RE
  # validation degrades any non-identifier segment to a safe skip instead.
  # Built via the same native-AMD64 Batch DinD infra as 0.3.40/0.3.47, from
  # merged main (0fc9de81).
  # 0.3.50 (workbench #921 + #922, items 83/84; 0.3.49 -- item 83 alone --
  # was never separately deployed here, superseded before its own build).
  # #921: on a deployment target, run_study_baseline now delegates to
  # remote_run_submit (the proven real dispatch mechanism) for the study's
  # default baseline entry instead of an unconditional 409 -- closes the
  # server-side half of the item-80 walkthrough's dispatch gap. Confirmed
  # zero overlap with the working "Run current spec" pinned-dispatch path
  # (the JS calls remote_run_submit directly when pinned, never reaching
  # this function) before merging. #922: remote_run_submit now writes a
  # pending-dispatch placeholder row immediately on a successful dispatch
  # (land_remote_run was previously the ONLY place a runs_meta row was ever
  # written for a remote run, so a UI-dispatched campaign was invisible in
  # the Runs tab until manually landed) -- best-effort, wrapped so it can
  # never block or fail the real dispatch; land_remote_run cleans up the
  # placeholder once the real row lands. Built via the same native-AMD64
  # Batch DinD infra as 0.3.40/0.3.47/0.3.48, from merged main (92970b69).
  # 0.3.52 (workbench #915, item 78, Arnab): _session_workspace_mw no longer
  # re-stamps the shared vw_session cookie to match a header-less request --
  # it mints the cookie only when absent. Fixes a real cross-tab bug where an
  # unrelated tab's incidental fetch could silently repoint another tab's next
  # plain reload at the wrong workspace, most visible on the long
  # switch-build materialization window Arnab hit. Workbench-only change --
  # no viva-api/scheduler/dispatch code touched. Built via the same
  # native-AMD64 Batch DinD infra as prior releases, from merged main
  # (d0c5d90f).
  - name: ghcr.io/vivarium-collective/vivarium-workbench
    newTag: 0.3.52

replicas:
  # Single writer: workbench holds a git working copy + SQLite on an RWO EBS volume.
  # Pinned here explicitly (not just inherited from base/workbench.yaml) so the count
  # lives alongside every other deployment's.
  - count: 1
    name: workbench

resources:
  - target-group-binding.yaml
  # ghcr pull secret: SAME encrypted SealedSecret content as
  # ../sms-api-stanford/secret-ghcr.yaml (both decrypt to the identical
  # `ghcr-secret` object in the shared sms-api-stanford namespace). Duplicated
  # here rather than cross-referenced, matching the existing precedent of
  # ../sms-api-stanford-db-migration/secret-ghcr.yaml (another sibling overlay
  # of the same namespace with its own copy). ../sms-api-stanford/secrets.sh's
  # WORKBENCH_DIR cp keeps this copy in sync whenever the ghcr credential rotates.
  - secret-ghcr.yaml
  # Fine-grained PAT (push-only, CovertLabEcoli/sms-ecoli) for the workbench's
  # non-interactive GitHub auth path (github_auth.py's VIVARIUM_WORKBENCH_GH_TOKEN
  # resolution, vivarium-workbench#652) — dispatch/study-authoring push access
  # without a human clicking "Sign in with GitHub" each session.
  - secret-workbench-gh-token.yaml
  # vivarium-workbench: peer Deployment+Service (base/workbench referenced directly,
  # NOT via base/kustomization.yaml, so it deploys ONLY on Stanford) + its EBS PVC.
  - ../../base/workbench
  - workbench-pvc.yaml

patches:
  # Browser-reachable PTools base for the pbg-ptools Omics Viewer. The seed
  # initContainer stamps this into the served workspace.yaml (ui.ptools_server_url).
  # Tunnel value (sms-proxy -s smscdk -> localhost:8080, PTools at the ALB root).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            initContainers:
              - name: seed-workspace
                env:
                  - name: PTOOLS_SERVER_URL
                    value: "http://localhost:8080"
                  # Omics Viewer DATA overlay: the in-cluster ptools pod fetches
                  # the study TSV from this workbench Service URL (same namespace,
                  # incl. the /workbench base path the container serves under).
                  # The seed also clears ui.ptools_data_dir so HTTP delivery is used.
                  - name: DASHBOARD_PUBLIC_BASE_URL
                    value: "http://workbench.sms-api-stanford.svc.cluster.local:8000/workbench"
    target:
      kind: Deployment
      name: workbench
  # Non-interactive GitHub auth (vivarium-workbench#652): a scoped, push-only
  # machine credential so POST /api/remote-run-start can push a session's
  # workspace changes (e.g. a newly-authored study.yaml) without a human
  # clicking "Sign in with GitHub" first. Lowest-priority resolution path —
  # an interactive session still always wins if one is present.
  #
  # VIVARIUM_WORKBENCH_REMOTE_DEPLOYMENT: remote_pinned.remote_deployment_name()
  # stamps this into every dispatched run's recorded Origin. Unset, it silently
  # falls back to the historical hardcoded default "smsvpctest" — every run
  # dispatched from THIS (smscdk) deployment has been mislabeling its own
  # Origin since the pinned-dispatch feature shipped. Found while verifying
  # the first landed sms-ecoli pilot run.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: VIVARIUM_WORKBENCH_GH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: workbench-gh-token
                        key: VIVARIUM_WORKBENCH_GH_TOKEN
                  - name: VIVARIUM_WORKBENCH_REMOTE_DEPLOYMENT
                    value: "smscdk"
    target:
      kind: Deployment
      name: workbench
