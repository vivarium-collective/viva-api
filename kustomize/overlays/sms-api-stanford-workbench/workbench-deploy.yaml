# Deployment-config layer for vivarium-workbench's ui.* bindings.
#
# Mounted read-only at /etc/vivarium-workbench/deploy.yaml and named by
# VIVARIUM_WORKBENCH_DEPLOY_CONFIG. The workbench overlays this on top of the
# served workspace.yaml's own ui: block (deployment wins; null unsets), so a
# workspace stops having to carry the identity of the site it runs on.
# See vivarium-workbench#471 and lib/deploy_config.py.
#
# Prod counterpart of config/sms-api-stanford-test/workbench-deploy.yaml. It
# lives in THIS overlay rather than config/sms-api-stanford/ because prod
# deliberately splits the api and workbench overlays (backlog item 21) -- the
# generated name carries a content hash, so the Deployment that mounts it and
# the generator that names it have to be rendered together.
ui:
  # Browser-reachable PTools base for the Omics Viewer. The workbench builds a
  # link the user's BROWSER opens, so this is the tunnel/ALB address
  # (sms-proxy.sh -s smscdk -> localhost:8080), not an in-cluster Service URL.
  ptools_server_url: "http://localhost:8080"

  # In-cluster workbench Service URL (including the /workbench base path) that
  # the ptools pod would fetch study TSVs from. Prod namespace.
  dashboard_public_base_url: "http://workbench.sms-api-stanford.svc.cluster.local:8000/workbench"

  # null = UNSET. Filesystem delivery is impossible here (the ptools pod has no
  # workspace mount), so the launcher must not be handed a data dir.
  ptools_data_dir: null
