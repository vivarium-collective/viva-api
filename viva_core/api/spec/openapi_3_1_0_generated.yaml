            type: array
          type: array
          minItems: 1
          title: Hops
          description: One node path per drill level
      additionalProperties: true
      type: object
      required:
      - ref
      - hops
      title: InnerCompositeRef
      description: '`hops` is a LIST OF NODE PATHS, each itself a list of key segments
        -- which

        is why this is a POST and not the GET the plan first assumed.'
    PackageType:
      type: string
      enum:
      - pypi
      - conda
      title: PackageType
    ProcessAddress:
      properties:
        address:
          type: string
          minLength: 1
          title: Address
          description: Registry address of a Process or Step
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
      additionalProperties: true
      type: object
      required:
      - address
      title: ProcessAddress
    ProcessRun:
      properties:
        address:
          type: string
          minLength: 1
          title: Address
          description: Registry address of a Process or Step
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
        inputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Inputs
        interval:
          anyOf:
          - type: number
          - type: 'null'
          title: Interval
      additionalProperties: true
      type: object
      required:
      - address
      title: ProcessRun
      description: 'One `update()` -- a probe, not a job. `env_worker._run_process`
        is

        deliberately NOT job-class: it builds one class, fills its ports and runs
        a

        single step, which is the Composite Explorer''s "try this process" button.'
    ReadoutCheck:
      properties:
        ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ref
        state:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: State
        schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Schema
        spec:
          additionalProperties: true
          type: object
          title: Spec
          description: The study spec whose readouts are checked
      additionalProperties: true
      type: object
      required:
      - spec
      title: ReadoutCheck
    RegisteredPackage:
      properties:
        database_id:
          type: integer
          title: Database Id
        package_type:
          $ref: '#/components/schemas/PackageType'
        name:
          type: string
          title: Name
        processes:
          items:
            $ref: '#/components/schemas/BiGraphProcess'
          type: array
          title: Processes
        steps:
          items:
            $ref: '#/components/schemas/BiGraphStep'
          type: array
          title: Steps
      type: object
      required:
