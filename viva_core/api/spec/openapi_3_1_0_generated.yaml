          additionalProperties:
            type: boolean
          type: object
          title: Services
      type: object
      required:
      - services
      title: CoreHealth
    DependencyModel:
      properties:
        name:
          type: string
          title: Name
        source:
          type: string
          title: Source
          default: pypi
        version:
          type: string
          title: Version
          default: ''
      type: object
      required:
      - name
      title: DependencyModel
    EnvWorkerStartRequest:
      properties:
        commit:
          type: string
          title: Commit
          description: Simulator commit; the prebuilt image tag to run
        callback_host:
          type: string
          title: Callback Host
          description: Host/IP the worker dials back to (the workbench pod IP)
        callback_port:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: Callback Port
          description: Port the workbench is listening on
        token:
          type: string
          title: Token
          description: One-time handshake token the worker must present
        workspace:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace
          description: Workspace path inside the worker container; defaults to the
            deployment's env_worker_workspace_path (the image's own checkout)
        session_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Key
          description: Owning session; makes the Job name unique per session
      type: object
      required:
      - commit
      - callback_host
      - callback_port
      - token
      title: EnvWorkerStartRequest
      description: "Where to dial back, and which environment to run.\n\n``commit``\
        \ selects the environment: it is the tag of the prebuilt simulator\nimage,\
        \ which under \xA72A.8 *is* the execution environment rather than a recipe\n\
        for rebuilding one."
    EnvWorkerStartResponse:
      properties:
        job_name:
          type: string
          title: Job Name
        image:
          type: string
          title: Image
        namespace:
          type: string
          title: Namespace
      type: object
      required:
      - job_name
      - image
      - namespace
      title: EnvWorkerStartResponse
    EnvWorkerStatusResponse:
      properties:
        job_name:
          type: string
          title: Job Name
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        exists:
          type: boolean
          title: Exists
          default: true
        logs:
          anyOf:
          - type: string
          - type: 'null'
          title: Logs
      type: object
      required:
      - job_name
      title: EnvWorkerStatusResponse
    EnvironmentModel:
      properties:
        image:
          type: string
          title: Image
        spec_hash:
          type: string
          title: Spec Hash
        image_digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Digest
      type: object
      required:
      - image
      - spec_hash
      title: EnvironmentModel
      description: 'What exists: the image a run would pull, and the two identities
        -- the request it answers

        (``spec_hash``) and what was built (``image_digest``; null until something
        records it).'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
