          - type: string
          - type: 'null'
          title: Note Prefix
        investigation_inputs_store:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Investigation Inputs Store
      additionalProperties: true
      type: object
      required:
      - address
      title: VizPreview
