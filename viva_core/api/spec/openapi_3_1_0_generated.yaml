        params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Params
          description: Method params
        timeout:
          type: number
          maximum: 3600.0
          exclusiveMinimum: 0.0
          title: Timeout
          description: Seconds to wait for this call's reply
          default: 300.0
      type: object
      required:
      - method
      title: RelayCallRequest
    RelayCallResponse:
      properties:
        result:
          anyOf:
          - {}
          - type: 'null'
          title: Result
      type: object
      title: RelayCallResponse
    RelayStartRequest:
      properties:
        commit:
          type: string
          title: Commit
          description: Simulator commit; the prebuilt image tag to run
        workspace:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace
          description: Workspace path inside the worker container
        session_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Key
          description: Owning session; makes the Job name unique per session
        accept_timeout:
          type: number
          maximum: 1800.0
          exclusiveMinimum: 0.0
          title: Accept Timeout
          description: Seconds to wait for the worker to dial back (pod schedule +
            image pull)
          default: 300.0
      type: object
      required:
      - commit
      title: RelayStartRequest
      description: Start a worker that dials back to *viva-api* rather than to the
        caller.
    RelayStartResponse:
      properties:
        job_name:
          type: string
          title: Job Name
        image:
          type: string
          title: Image
        namespace:
          type: string
          title: Namespace
        connected:
          type: boolean
          title: Connected
      type: object
      required:
      - job_name
      - image
      - namespace
      - connected
      title: RelayStartResponse
    ResolveEnvironmentRequest:
      properties:
        kind:
          type: string
          enum:
          - explicit
          - derived
          title: Kind
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        variant:
          type: string
          title: Variant
          default: ''
        dependencies:
          items:
            $ref: '#/components/schemas/DependencyModel'
          type: array
          title: Dependencies
      type: object
      required:
      - kind
      title: ResolveEnvironmentRequest
      description: 'What is needed. ``explicit``: the environment named ``key`` (a
        commit, or its own marked tag),

        optionally its ``variant`` image. ``derived``: whatever satisfies ``dependencies``
        -- an EMPTY list

        is a real request, for a composite that needs only the built-ins.'
    StateDocument:
      properties:
        document:
          additionalProperties: true
          type: object
          title: Document
          description: An already-resolved composite state
        ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ref
          description: Generator whose core_extensions resolve bare addresses
      additionalProperties: true
      type: object
      required:
      - document
      title: StateDocument
    TaskResponse:
      properties:
        task_id:
          type: integer
          title: Task Id
        job_name:
          type: string
          title: Job Name
        method:
          type: string
          title: Method
        status:
          type: string
          title: Status
        result:
          anyOf:
          - {}
          - type: 'null'
          title: Result
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended At
      type: object
      required:
      - task_id
      - job_name
      - method
      - status
      title: TaskResponse
    TaskStatusResponse:
      properties:
        task_id:
          type: integer
          title: Task Id
        job_name:
          type: string
          title: Job Name
        method:
          type: string
          title: Method
        status:
          type: string
          title: Status
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended At
        has_result:
          type: boolean
          title: Has Result
          default: false
      type: object
      required:
      - task_id
      - job_name
      - method
      - status
      title: TaskStatusResponse
      description: "A task WITHOUT its result \u2014 the shape the batch endpoint\
        \ returns.\n\nMeasured on dev before this existed: five tasks came back as\
        \ **1.19 MB**,\nof which 1.185 MB was result payloads. The endpoint exists\
        \ so a campaign can\nbe polled without N round trips; inlining every result\
        \ defeats exactly that,\nand the cost grows with both the number of tasks\
        \ and the size of what they\nreturned. Polling twenty tasks every few seconds\
        \ would have moved megabytes\nper cycle over an SSM tunnel.\n\nSo a *status*\
        \ endpoint returns status. Fetch the singular\n``GET /tasks/{id}`` for the\
        \ payload, which is one request at the one moment\na caller actually wants\
        \ it."
    TaskSubmitRequest:
      properties:
        job_name:
          type: string
          title: Job Name
          description: Relayed worker Job to run this on
        method:
          type: string
          title: Method
          description: Worker method (JSON-RPC)
        params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Params
          description: Method params
      type: object
      required:
      - job_name
      - method
      title: TaskSubmitRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ViewerLaunch:
