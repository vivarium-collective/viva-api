  /viva/v1/env-worker/relay/workers/{job_name}/analysis-viewers:
    get:
      tags:
      - Env Worker Reads
      summary: Viewer descriptors contributed by the workspace's packages
      description: 'The listing half of `analysis_viewers`. A GET, because it is a
        read --

        the `action` flag that used to hide this behind the same name as `launch`
        is

        exactly the kind of thing named endpoints exist to separate.'
      operationId: list-env-worker-analysis-viewers
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List-Env-Worker-Analysis-Viewers
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/analysis-viewers/launch:
    post:
      tags:
      - Env Worker Documents
      summary: Resolve and invoke one contributed viewer's launch
      description: 'POST rather than GET: this invokes a contributor''s callable,
        which may do

        anything the workspace''s code can do. Same operation as `?action=launch`,

        with `uid` required instead of silently defaulting to the listing.'
      operationId: launch-env-worker-analysis-viewer
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewerLaunch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Launch-Env-Worker-Analysis-Viewer
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/tasks:
    post:
      tags:
      - Env Worker
      summary: Submit a long-running env-worker call; poll for its result
      description: '202 with a task id. The row is written BEFORE this returns.


        That ordering is compose''s contract and it matters more here: the client
        is

        told to poll and holds nothing else, so a status read that 404s because the

        row had not been written yet would be indistinguishable from a lost task.'
      operationId: submit-env-worker-task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSubmitRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/tasks/{task_id}:
    get:
      tags:
      - Env Worker
      summary: Status and result of one env-worker task
      operationId: get-env-worker-task
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Env Worker
      summary: Cancel a task you started
      description: "The one authorization rule in this API: you cannot cancel someone\
        \ else's work.\n\nIt exists to prevent an ACCIDENT \u2014 killing a colleague's\
        \ six-hour study \u2014\nnot an adversary, who can set the identity header\
        \ to anything. See\nviva_api/api/auth.py.\n\nA task nobody claimed (created_by\
        \ NULL, which is every task on a deployment\nwith no identity proxy) is cancellable\
        \ by anyone: there is no owner to\nprotect, and refusing would make the endpoint\
        \ useless exactly where identity\nis unavailable.\n\nAnonymity is refused\
        \ only HERE, and only because the alternative is a\ndecorative rule: if an\
        \ unidentified caller could cancel anything, omitting\nthe header would bypass\
        \ ownership entirely."
      operationId: cancel-env-worker-task
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/tasks/status/batch:
    get:
      tags:
      - Env Worker
      summary: Status for many env-worker tasks in one call (no result payloads)
      description: "Status only \u2014 results are deliberately omitted. See TaskStatusResponse.\n\
        \nMirrors compose's /simulations/status/batch, which returns rows carrying\
        \ no\nlarge payload. A campaign is many tasks, and polling them one at a time\
        \ is\nwhat this endpoint exists to avoid; shipping every result inline reintroduced\n\
        the cost in a different dimension."
      operationId: get-env-worker-tasks-batch
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
          title: Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskStatusResponse'
                title: Response Get-Env-Worker-Tasks-Batch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BiGraphComputeType:
      type: string
      enum:
      - process
      - step
      title: BiGraphComputeType
    BiGraphProcess:
      properties:
        module:
          type: string
          title: Module
        name:
          type: string
          title: Name
        compute_type:
          $ref: '#/components/schemas/BiGraphComputeType'
        inputs:
          type: string
          title: Inputs
        outputs:
          type: string
          title: Outputs
        database_id:
          type: integer
          title: Database Id
      type: object
      required:
      - module
      - name
      - compute_type
      - inputs
      - outputs
      - database_id
      title: BiGraphProcess
    BiGraphStep:
      properties:
        module:
          type: string
          title: Module
        name:
          type: string
          title: Name
        compute_type:
          $ref: '#/components/schemas/BiGraphComputeType'
        inputs:
          type: string
          title: Inputs
        outputs:
          type: string
          title: Outputs
        database_id:
          type: integer
          title: Database Id
      type: object
      required:
      - module
      - name
      - compute_type
      - inputs
      - outputs
      - database_id
      title: BiGraphStep
    BiomodelInfo:
      properties:
        biomodel_id:
          type: string
          title: Biomodel Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - biomodel_id
      - metadata
      title: BiomodelInfo
    BiomodelSimulator:
      type: string
      enum:
      - copasi
      - tellurium
      title: BiomodelSimulator
    BiomodelsRunRequest:
      properties:
        model_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Model Ids
          description: Specific BioModel IDs to run. Mutually exclusive with n_models.
        n_models:
          anyOf:
          - type: integer
            maximum: 1000.0
            minimum: 1.0
          - type: 'null'
          title: N Models
          description: Run the first N BioModels. Ignored if model_ids is set.
        simulators:
          items:
            $ref: '#/components/schemas/BiomodelSimulator'
          type: array
          title: Simulators
          description: Simulators to run for each model. A single simulator runs the
            model on it; several are wired into one PB document per model for cross-validation
            (the former 'audit'/'regression' behavior).
      type: object
      title: BiomodelsRunRequest
      description: "One request shape for every BioModels run \u2014 subsumes the\
        \ former\nsingle/batch/audit/regression endpoints. Cardinality comes from\n\
        ``model_ids``/``n_models``; per-model cross-validation comes from listing\n\
        more than one simulator."
    BiomodelsRunResult:
      properties:
        submitted:
          items:
            $ref: '#/components/schemas/ComposeSimulationExperiment'
          type: array
          title: Submitted
        failed:
          items:
            type: string
          type: array
          title: Failed
          description: BioModel IDs that failed to submit.
        total_requested:
          type: integer
          title: Total Requested
          description: Number of models attempted (len(submitted) + len(failed)).
      type: object
      required:
      - submitted
      - total_requested
      title: BiomodelsRunResult
    Body_compose-run-copasi:
      properties:
        sbml:
          type: string
          contentMediaType: application/octet-stream
          title: Sbml
      type: object
      required:
      - sbml
      title: Body_compose-run-copasi
    Body_compose-run-simulation:
      properties:
        uploaded_file:
          type: string
          contentMediaType: application/octet-stream
          title: Uploaded File
        analysis_options:
          anyOf:
          - type: string
          - type: 'null'
          title: Analysis Options
      type: object
      required:
      - uploaded_file
      title: Body_compose-run-simulation
    Body_compose-run-tellurium:
      properties:
        sbml:
          type: string
          contentMediaType: application/octet-stream
          title: Sbml
      type: object
      required:
      - sbml
      title: Body_compose-run-tellurium
    ComposeDocumentSubmission:
      properties:
        document:
          additionalProperties: true
          type: object
          title: Document
          description: The composite document itself, as JSON
        interval_time:
          type: number
          title: Interval Time
          default: 1.0
        batch_submission:
          type: boolean
          title: Batch Submission
          default: false
        simulator_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulator Id
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        compute_backend:
          anyOf:
          - $ref: '#/components/schemas/ComputeBackend'
          - type: 'null'
        extra_pip_deps:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Extra Pip Deps
        num_nodes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Nodes
        analysis_options:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Analysis Options
      type: object
      required:
      - document
      title: ComposeDocumentSubmission
      description: 'A process-bigraph document submitted inline as JSON (POST body),
        the

        sibling of ComposeSimulationRequest''s file-upload transport -- same

        downstream dispatch, different input shape. Field name/shape mirrors

        env_worker.py''s own StateDocument.document for naming consistency across

        this repo''s two JSON-body document-submission paths.'
    ComposeHpcRun:
      properties:
        database_id:
          type: integer
          title: Database Id
        slurmjobid:
          type: integer
          title: Slurmjobid
        job_id_ext:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id Ext
        job_backend:
          type: string
          title: Job Backend
          default: slurm
        correlation_id:
          type: string
          title: Correlation Id
        job_type:
          $ref: '#/components/schemas/ComposeJobType'
        sim_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sim Id
        simulator_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulator Id
        status:
          anyOf:
          - $ref: '#/components/schemas/ComposeJobStatus'
          - type: 'null'
        start_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
          - type: 'null'
          title: End Time
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
      type: object
      required:
      - database_id
      - slurmjobid
      - correlation_id
      - job_type
      - sim_id
      - simulator_id
      title: ComposeHpcRun
    ComposeJobStatus:
      type: string
      enum:
      - waiting
      - queued
      - running
      - completed
      - failed
      - pending
      - cancelled
      - out_of_memory
      - suspended
      - timeout
      - unknown
      title: ComposeJobStatus
    ComposeJobType:
      type: string
      enum:
      - simulation
      - build_container
      title: ComposeJobType
    ComposeRegisteredSimulators:
      properties:
        versions:
          items:
            $ref: '#/components/schemas/ComposeSimulatorVersion'
          type: array
          title: Versions
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
      type: object
      required:
      - versions
      title: ComposeRegisteredSimulators
    ComposeSimulationExperiment:
      properties:
        simulation_database_id:
          type: integer
          title: Simulation Database Id
        simulator_database_id:
          type: integer
          title: Simulator Database Id
        last_updated:
          type: string
          title: Last Updated
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
      type: object
      required:
      - simulation_database_id
      - simulator_database_id
      title: ComposeSimulationExperiment
    ComposeSimulatorVersion:
      properties:
        singularity_def:
          $ref: '#/components/schemas/ContainerizationFileRepr'
        singularity_def_hash:
          type: string
          title: Singularity Def Hash
        packages:
          anyOf:
          - items:
              $ref: '#/components/schemas/RegisteredPackage'
            type: array
          - type: 'null'
          title: Packages
        database_id:
          type: integer
          title: Database Id
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - singularity_def
      - singularity_def_hash
      - packages
      - database_id
      title: ComposeSimulatorVersion
    CompositeRef:
      properties:
        ref:
          type: string
          minLength: 1
          title: Ref
          description: Registered @composite_generator name
        overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Overrides
          description: Generator parameter overrides
      additionalProperties: true
      type: object
      required:
      - ref
      title: CompositeRef
      description: A composite named by a registered generator, optionally with overrides.
    CompositeSelector:
      properties:
        ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ref
        state:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: State
        schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Schema
      additionalProperties: true
      type: object
      title: CompositeSelector
      description: 'A composite given EITHER by `ref` OR inline as `{state, schema}`.


        Both forms are real and the worker accepts either; sending neither is the

        mistake worth catching here, because the worker answers it with

        `__not_registered__` -- which reads as "your ref is wrong" to a caller who

        sent no ref at all.'
    ComputeBackend:
      type: string
      enum:
      - slurm
      - batch
      - ray
      title: ComputeBackend
      description: 'The DEFAULT dispatch mechanism of a deployment (``COMPUTE_BACKEND``),
        and the per-request choice a

        compose run may make. Coarser than :class:`JobBackend`: it names a way of
        running, not a job''s home.'
    ConfigDocument:
      properties:
        config:
          additionalProperties: true
          type: object
          title: Config
          description: A simulator config document, in the shape the worker's workspace
            translates
      additionalProperties: true
      type: object
      required:
      - config
      title: ConfigDocument
    ContainerizationEngine:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      title: ContainerizationEngine
      description: The container engine a definition targets.
    ContainerizationFileRepr:
      properties:
        representation:
          type: string
          title: Representation
        containerization_engine:
          $ref: '#/components/schemas/ContainerizationEngine'
          default: 2
      type: object
      required:
      - representation
      title: ContainerizationFileRepr
      description: A textual container-definition file (e.g. a Singularity/apptainer
        def).
    CoreHealth:
      properties:
        status:
          type: string
