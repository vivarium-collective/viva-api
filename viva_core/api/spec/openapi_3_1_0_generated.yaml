openapi: 3.1.0
info:
  title: viva-core
  version: 0.1.0
paths:
  /viva/v1/health:
    get:
      tags:
      - Viva Core
      summary: Health
      description: Which core services this deployment provides. Core's own; the application
        has its own.
      operationId: core-health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreHealth'
  /viva/v1/environments/resolve:
    post:
      tags:
      - Viva Core
      - Environments
      summary: Which environment would a run with this need be given? (select; never
        builds)
      operationId: core-resolve-environment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEnvironmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulation/run:
    post:
      tags:
      - Compose Simulation
      summary: Run a process-bigraph simulation (OMEX/PBG/SBML upload)
      operationId: compose-run-simulation
      parameters:
      - name: interval_time
        in: query
        required: false
        schema:
          type: number
          default: 1.0
          title: Interval Time
      - name: batch_submission
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Batch Submission
      - name: simulator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulator Id
      - name: environment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Run in a registered environment instead of a simulator''s
            image: ''runtime'' is the core runtime image, for a composite that needs
            only what process-bigraph ships. Not with simulator_id.'
          title: Environment
        description: 'Run in a registered environment instead of a simulator''s image:
          ''runtime'' is the core runtime image, for a composite that needs only what
          process-bigraph ships. Not with simulator_id.'
      - name: compute_backend
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ComputeBackend'
          - type: 'null'
          title: Compute Backend
      - name: extra_pip_deps
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Extra Pip Deps
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_compose-run-simulation'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeSimulationExperiment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulation/run-document:
    post:
      tags:
      - Compose Simulation
      summary: Run a process-bigraph simulation (document as inline JSON)
      description: "The JSON-body sibling of ``submit_simulation`` \u2014 same dispatch,\
        \ no\nmultipart file needed. For a programmatic caller (a CLI, a generated\n\
        client, or a future workbench path) that already holds the document as a\n\
        Python/JSON value, this skips the upload-file round-trip entirely."
      operationId: compose-run-simulation-document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeDocumentSubmission'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeSimulationExperiment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulation/{simulation_id}/status:
    get:
      tags:
      - Compose Results
      summary: Get compose simulation job status
      operationId: compose-get-simulation-status
      parameters:
      - name: simulation_id
        in: path
        required: true
        schema:
          type: integer
          title: Simulation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeHpcRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulations/status/batch:
    get:
      tags:
      - Compose Results
      summary: Batch status lookup for compose simulations
      operationId: compose-get-simulations-status-batch
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
          title: Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComposeHpcRun'
                title: Response Compose-Get-Simulations-Status-Batch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulation/{simulation_id}/results:
    get:
      tags:
      - Compose Results
      summary: Download compose simulation results (zip on SLURM, tar.gz on Ray/Batch)
      operationId: compose-get-simulation-results
      parameters:
      - name: simulation_id
        in: path
        required: true
        schema:
          type: integer
          title: Simulation Id
      responses:
        '200':
          description: Results archive -- a zip on SLURM (SSH/SCP off the HPC filesystem),
            a tar.gz on Ray/Batch (streamed from S3)
          content:
            application/json:
              schema: {}
            application/zip: {}
            application/gzip: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulator/{simulator_id}/build/status:
    get:
      tags:
      - Compose Results
      summary: Get compose container build status
      operationId: compose-get-simulator-build-status
      parameters:
      - name: simulator_id
        in: path
        required: true
        schema:
          type: integer
          title: Simulator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeHpcRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulation/{simulation_id}/document:
    get:
      tags:
      - Compose Results
      summary: Retrieve the process-bigraph document used for a compose simulation
      description: 'Return the process-bigraph document (PBG JSON, SBML XML, or OMEX
        manifest)

        that was uploaded when this simulation was submitted.'
      operationId: compose-get-simulation-document
      parameters:
      - name: simulation_id
        in: path
        required: true
        schema:
          type: integer
          title: Simulation Id
      responses:
        '200':
          description: PBG/SBML document content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Compose-Get-Simulation-Document
        '404':
          description: Simulation not found or no document stored
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/simulators:
    get:
      tags:
      - Compose Compute
      summary: List registered compose simulators
      operationId: compose-list-simulators
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeRegisteredSimulators'
  /viva/v1/compose/processes:
    get:
      tags:
      - Compose Compute
      summary: List registered process-bigraph processes
      operationId: compose-list-processes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BiGraphProcess'
                type: array
                title: Response Compose-List-Processes
  /viva/v1/compose/steps:
    get:
      tags:
      - Compose Compute
      summary: List registered process-bigraph steps
      operationId: compose-list-steps
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BiGraphStep'
                type: array
                title: Response Compose-List-Steps
  /viva/v1/compose/curated/copasi:
    post:
      tags:
      - Compose Curated
      summary: Run COPASI simulation from SBML
      operationId: compose-run-copasi
      parameters:
      - name: start_time
        in: query
        required: true
        schema:
          type: number
          title: Start Time
      - name: duration
        in: query
        required: true
        schema:
          type: number
          title: Duration
      - name: num_data_points
        in: query
        required: true
        schema:
          type: number
          title: Num Data Points
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_compose-run-copasi'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeSimulationExperiment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/curated/tellurium:
    post:
      tags:
      - Compose Curated
      summary: Run Tellurium simulation from SBML
      operationId: compose-run-tellurium
      parameters:
      - name: start_time
        in: query
        required: true
        schema:
          type: number
          title: Start Time
      - name: end_time
        in: query
        required: true
        schema:
          type: number
          title: End Time
      - name: num_data_points
        in: query
        required: true
        schema:
          type: number
          title: Num Data Points
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_compose-run-tellurium'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeSimulationExperiment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/biomodels/identifiers:
    get:
      tags:
      - Compose BioModels
      summary: List BioModels database identifiers
      operationId: compose-list-biomodel-identifiers
      parameters:
      - name: n
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Max number of identifiers to return.
          default: 20
          title: N
        description: Max number of identifiers to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                title: Response Compose-List-Biomodel-Identifiers
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/biomodels/{biomodel_id}/metadata:
    get:
      tags:
      - Compose BioModels
      summary: Get metadata for a BioModels database entry
      operationId: compose-get-biomodel-metadata
      parameters:
      - name: biomodel_id
        in: path
        required: true
        schema:
          type: string
          title: Biomodel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiomodelInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/compose/biomodels/run:
    post:
      tags:
      - Compose BioModels
      summary: Run one or more BioModels through one or more simulators
      description: "Single entry point for BioModels runs \u2014 subsumes the former\n\
        single/batch/audit/regression endpoints.\n\n- ``model_ids`` (or the first\
        \ ``n_models``) selects which models to run.\n- ``simulators``: one runs each\
        \ model on that simulator; several wire all of\n  them into one PB document\
        \ per model for cross-validation.\n\nEach model is submitted independently;\
        \ one that fails to load or submit is\ncollected in ``failed`` rather than\
        \ aborting the run."
      operationId: compose-run-biomodels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiomodelsRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiomodelsRunResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/workers:
    post:
      tags:
      - Env Worker
      summary: Run a simulator image as an env worker that dials back to the caller
      operationId: start-env-worker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvWorkerStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvWorkerStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/workers/{job_name}:
    get:
      tags:
      - Env Worker
      summary: Status of an env worker, with logs when it has failed
      operationId: get-env-worker-status
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      - name: include_logs
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Logs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvWorkerStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Env Worker
      summary: Delete an env worker Job (idempotent)
      operationId: stop-env-worker
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Stop-Env-Worker
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers:
    post:
      tags:
      - Env Worker
      summary: Start an env worker that dials back to viva-api, and hold its connection
      operationId: start-relayed-env-worker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/call:
    post:
      tags:
      - Env Worker
      summary: Forward one JSON-RPC call to a relayed env worker
      description: "One request, one reply \u2014 the worker protocol is already request/response.\n\
        \nDeliberately RAW: whatever the worker returned is handed back untouched,\n\
        sentinels included. This is the escape hatch, and a caller reaching for it\n\
        has asked for the protocol rather than for an interpretation of it. The\n\
        named endpoints below are where sentinels become status codes."
      operationId: call-relayed-env-worker
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayCallRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayCallResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}:
    delete:
      tags:
      - Env Worker
      summary: Close a relayed worker's connection and delete its Job (idempotent)
      description: "Stop a worker. NOT ownership-checked, deliberately \u2014 and\
        \ its tasks are\nsettled with attribution instead.\n\nStopping a worker is\
        \ overwhelmingly an AUTOMATIC operation: the workbench's\npool calls it on\
        \ LRU eviction, idle reap, dead-worker replacement and process\nexit. The\
        \ pool has no identity to present, so an ownership check here would\neither\
        \ break it or have to let unidentified callers through \u2014 which is the\n\
        very bypass such a check would exist to close, and would leave the perverse\n\
        rule that anonymous callers may stop workers while identified ones may not.\n\
        \nSo the worker is shared infrastructure with an automatic lifecycle; the\
        \ task\nis the unit of work that has an owner. What is owed to someone whose\
        \ task\ndies with a worker is not a veto but an EXPLANATION: their task moves\
        \ to a\nterminal state naming what happened and, where identity is configured,\
        \ who\ndid it \u2014 rather than hanging in `running` until somebody wonders."
      operationId: stop-relayed-env-worker
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Stop-Relayed-Env-Worker
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/generators:
    get:
      tags:
      - Env Worker Reads
      summary: Composite generators registered in the worker's workspace
      description: 'The health check that actually proves the arc, and the reason
        this one

        earns an endpoint despite having no workbench caller.


        `ping` and `initialize` pass even when the workspace is wrong. This does not:

        a worker that could not import the workspace falls back to a GLOBAL scan of

        everything installed in the image, and the give-away is the count of

        generators from packages the workspace does not own.'
      operationId: list-env-worker-generators
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List-Env-Worker-Generators
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/registry:
    get:
      tags:
      - Env Worker Reads
      summary: Process/step/type names in the worker's core
      operationId: read-env-worker-registry
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Read-Env-Worker-Registry
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/composites:
    get:
      tags:
      - Env Worker Reads
      summary: Composites discoverable in the worker's workspace
      operationId: discover-env-worker-composites
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Discover-Env-Worker-Composites
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/composites/full:
    get:
      tags:
      - Env Worker Reads
      summary: Discovered composites with their resolved detail
      description: 'The expensive sibling of `/composites`: it resolves each one.
        Separate

        URLs rather than a `?full=` flag, because the cost difference is large enough

        that a caller should have to ask for it in the path.'
      operationId: read-env-worker-composites-full
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Read-Env-Worker-Composites-Full
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/visualizations:
    get:
      tags:
      - Env Worker Reads
      summary: Visualization classes available in the worker's workspace
      operationId: list-env-worker-visualizations
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List-Env-Worker-Visualizations
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/visualizations/inputs:
    get:
      tags:
      - Env Worker Reads
      summary: Declared input ports of each visualization class
      operationId: read-env-worker-visualization-inputs
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Read-Env-Worker-Visualization-Inputs
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/core-snapshot:
    get:
      tags:
      - Env Worker Reads
      summary: Registry snapshot plus the workspace document, for a report render
      description: '`package_path` is REQUIRED rather than defaulted. The worker imports

        `<package_path>.core` and `<package_path>.document`; a default here would

        guess at the caller''s workspace and import whatever that guess named.'
      operationId: read-env-worker-core-snapshot
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      - name: package_path
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Package Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Read-Env-Worker-Core-Snapshot
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /viva/v1/env-worker/relay/workers/{job_name}/reexports:
    get:
      tags:
      - Env Worker Reads
      summary: Which allow-listed package re-exports each class
      description: '`include` is the caller''s allow-list of packages to scan, repeated:

        `?include=a&include=b`. The worker imports each one, so an empty list means

