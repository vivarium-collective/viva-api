# sshd drop-in for the throwaway test cluster only. Never ships anywhere.
#
# UsePAM no
#   The image's PAM account stack denies root outright on some hosts -- sshd logs
#   "Access denied for user root by PAM account configuration [preauth]" and drops the
#   connection before any key is offered. Whether it does so depends on the host, not on
#   anything these tests exercise: it passes on Docker Desktop and fails on a GitHub
#   Linux runner. Public-key authentication does not need PAM, and turning it off also
#   skips pam_loginuid and pam_namespace, neither of which works reliably in a container.
#
# PerSourcePenalties no
#   OpenSSH 9.8+ blackholes a source address after failed attempts. A readiness probe can
#   legitimately fail while the cluster is still starting, and the penalty would then
#   outlast its cause and poison every later connection from the same host.
#
# The filename sorts before 50-redhat.conf on purpose: sshd_config includes the drop-in
# directory first and the first value obtained for a keyword wins, so a 99- prefix would
# silently lose to the image's own UsePAM yes.
UsePAM no
PerSourcePenalties no
