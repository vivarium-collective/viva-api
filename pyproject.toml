[project]
name = "viva_api"
version = "0.9.158"
description = "This is the api server for Vivarium simulation services."
authors = [{ name = "Alex Patrie", email = "alexanderpatrie@gmail.com" }, { name = "Jim Schaff", email = "jschaff@gmail.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "uvicorn>=0.34.3,<0.50",
    "dotenv>=0.9.9,<0.10",
    "fastapi>=0.135.0",
    "pydantic>=2.11.5,<3",
    "asyncssh>=2.21.0,<3",
    "pydantic-settings>=2.9.1,<3",
    "pyyaml>=6.0.2,<7",
    "typing-extensions>=4.14.0,<5",
    "pymongo>=4.13.0,<5",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "asyncpg>=0.30.0,<0.32",
    "redis>=5.0.0,<9",
    "alembic>=1.16.2,<2",
    "Mako>=1.3.12",
    "httpx>=0.28.1,<0.29",
    # OIDC bearer-token validation (viva_api/api/oidc.py). Declared explicitly
    # rather than relied on transitively: PyJWT arrives today via another
    # dependency, and a transitive pin that moves would break token validation
    # silently, which is the exact failure mode this feature is prone to.
    # The [crypto] extra brings `cryptography`, needed for RS256.
    "pyjwt[crypto]>=2.10,<3",
    "polars-lts-cpu[pyarrow]>=1.31.0,<2",
    "python-multipart>=0.0.27",
    "marimo>=0.23.0,<1",
    "numpy>=2.3.1,<3",
    "duckdb>=1.3.1,<2",
    "altair>=5.5.0,<7",
    "sqlglot>=26.33.0,<31",
    "nbformat>=5.10.4,<6",
    "vegafusion>=2.0.2,<3",
    "vl-convert-python>=1.8.0,<2",
    "tqdm>=4.67.1,<5",
    "seaborn>=0.13.2,<0.14",
    "python-dateutil>=2.9.0.post0,<3",
    "anywidget>=0.9.18,<0.12",
    "orjson>=3.11.1",
    "pandas-stubs>=2.3.0.250703",
    "xmltodict>=0.14.2",
    "ijson>=3.4.0",
    "gcloud-aio-storage>=9.6.0",
    "aiofiles>=24.1.0",
    "aioboto3>=13.3.0",
    "types-aioboto3[s3]>=13.3.0",
    "xarray>=2024.6.0",
    "zarr>=3.0.0",
    "s3fs>=2024.6.0",
    "simhash>=2.1.2",
    "fastapi-swagger-dark>=0.0.9",
    "numba>=0.63.1",
    "typer>=0.16.1",
    "kubernetes>=31.0.0",
    "httpx>=0.28.0",
    "textual>=3.2.0",
    "rich-pyfiglet>=1.0.0",
    "rich-pixels>=3.0.1",
    "pillow>=12.2.0",
    # compose-api deps (process-bigraph ecosystem)
    "nats-py>=2.10.0,<3",
    "python-libsedml>=2.0.33",
    "biosimulators-utils>=0.2.3",
    "python-libsbml>=5.20.5",
    "spython>=0.3.14",
    "biomodels>=0.3.2",
]

[project.scripts]
atlantis = "app.cli:main"

[project.urls]
Repository = "https://github.com/vivarium-collective/viva-api"
Documentation = "https://vivarium-collective.github.io/viva-api/"

[dependency-groups]
dev = [
    # EXACT pin: must equal .pre-commit-config.yaml's ruff-pre-commit rev.
    # Enforced by tests/test_tooling_versions.py — see that module for why a
    # range here is what let the two drift apart in the first place.
    "ruff==0.12.12",
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0,<8",
    "deptry>=0.16.2,<0.26",
    "mypy>=1.5.1,<2.2",
    "pre-commit>=3.4.0,<5",
    "tox>=4.11.1,<5",
    "types-requests>=2.32.0.20250602,<3",
    "types-pyyaml>=6.0.12.20250516,<7",
    "pytest-asyncio>=1.0.0,<2",
    "testcontainers[nats, postgres, redis]>=4.10.0,<5",
    "types-tqdm>=4.67.0.20250516,<5",
    "openapi-python-client>=0.25.2,<0.30",
    "types-xmltodict>=0.14.0.20241009",
    "debugpy>=1.8.16",
    "ipdb>=0.13.13",
    "types-aiofiles>=25.1.0.20251011",
    "types-python-dateutil>=2.9.0.20251115",
    "import-linter>=2.15",
    "types-boto3[batch,ecr,logs,s3]>=1.40,<2",
    "kubernetes-stubs-elephant-fork>=36.0.3.post1",
]
docs = [
    "sphinx>=8.2.3,<10",
    "sphinx-autodoc-typehints>=3.2.0,<4",
    "sphinx-rtd-theme>=3.0.2,<4",
    "myst-parser>=4.0.1,<6",
    "furo>=2025.12.19",
]

[tool.uv]
default-groups = [
    "dev",
    "docs"
]
constraint-dependencies = [
    # Security: force patched urllib3 (transitive via requests/httpx/boto3)
    "urllib3>=2.7.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "viva_api",
    "viva_core",
    "sms_api",
    "tests",
    "app",
]

[tool.hatch.build.targets.wheel]
include = [
    "viva_api",
    "viva_core",
    "sms_api",
    "tests",
    "app",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
files = ["viva_api", "viva_core", "tests", "app"]
strict = true
exclude = ['^notes/', '^viva_api/api/client/.*', '^app/ui/.*', '^app/tui\\.py$', '^sms_api/.*']

[[tool.mypy.overrides]]
module = ["textual", "textual.*", "process_bigraph", "process_bigraph.*", "bigraph_schema", "bigraph_schema.*", "viva_emitters", "viva_emitters.*", "v2ecoli", "v2ecoli.*", "biosimulators_utils.*", "libsedml.*", "libsbml.*", "spython.*", "nats.*", "biomodels", "biomodels.*", "fsspec", "fsspec.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# D12 (docs/plan-core.md): core carries no `Any`. `strict` does not forbid `Any`; these two flags
# do. Both entries are GLOBS on purpose: a module that moves into core, or a new module of the
# ray package, comes under the ban the day it arrives. (The dispatch package was listed by name while
# the dispatch strategies moved -- those PRs were proven by AST identity, which an annotation
# change would have broken -- and became a glob in plan sequence PR 12.)
# tests/core/test_no_any_in_core.py pins both globs.
[[tool.mypy.overrides]]
module = [
    "viva_core",
    "viva_core.*",
    "viva_api.simulation.dispatch",
    "viva_api.simulation.dispatch.*",
]
disallow_any_explicit = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["app.tui"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=html"

[tool.importlinter]
# Core split, P0 (docs/plan-core.md): these contracts describe the seams the split will cut,
# BEFORE any code moves. They run REPORT-ONLY from `make check` (`make imports` to see them,
# `make imports-strict` to fail on them) -- several are knowingly broken today, and the
# breakages are the work list in docs/architecture-core.md Part 3. Contracts look at DIRECT
# imports only (allow_indirect_imports) so each reported line is one edge to cut. A contract flips to
# enforcing (moves into `make check` proper) in the phase that fixes it. P1 added
# `viva_core` and its contract, `core-is-standalone`, which is enforced from day one; a
# module that moves into viva_core leaves the "future core" lists below.
root_packages = ["viva_api", "viva_core", "app"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "core-is-standalone"
name = "viva_core imports neither viva_api nor app (ENFORCED)"
type = "forbidden"
source_modules = ["viva_core"]
forbidden_modules = ["viva_api", "app"]
# No allow_indirect_imports here: core must not reach viva_api even transitively.

[[tool.importlinter.contracts]]
id = "generic-infra-is-domain-free"
name = "Future core: generic infrastructure imports no SMS application code"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "viva_api.common.messaging",
    "viva_api.common.hpc",
    "viva_api.common.dispatch_validation",
    "viva_api.api.auth",
    "viva_api.api.oidc",
]
forbidden_modules = [
    "viva_api.simulation",
    "viva_api.analysis",
    "viva_api.data",
    "viva_api.common.handlers",
    "viva_api.common.simulator_defaults",
    "viva_api.common.analysis_dag",
    "viva_api.dependencies",
    "app",
]

[[tool.importlinter.contracts]]
id = "env-worker-is-domain-free"
name = "Future core: env workers and the relay import no SMS application code"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "viva_api.compose.env_worker_service",
    "viva_api.compose.env_worker_relay",
]
forbidden_modules = [
    "viva_api.simulation",
    "viva_api.analysis",
    "viva_api.data",
    "viva_api.common.handlers",
    "viva_api.common.simulator_defaults",
    "viva_api.common.analysis_dag",
    "app",
]

[[tool.importlinter.contracts]]
id = "compose-is-domain-free"
name = "Future core: compose imports no SMS application code (ENFORCED)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["viva_api.compose"]
forbidden_modules = [
    "viva_api.simulation",
    "viva_api.analysis",
    "viva_api.data",
    "viva_api.common.handlers",
    "viva_api.common.simulator_defaults",
    "viva_api.common.analysis_dag",
    "app",
]

[[tool.importlinter.contracts]]
id = "config-is-domain-free"
name = "Future core: config imports no SMS application code"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["viva_api.config"]
forbidden_modules = [
    "viva_api.simulation",
    "viva_api.analysis",
    "viva_api.common.handlers",
    "viva_api.common.simulator_defaults",
]

[[tool.importlinter.contracts]]
id = "server-does-not-import-clients"
name = "The server never imports the clients (app)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["viva_api"]
forbidden_modules = ["app"]

[[tool.importlinter.contracts]]
id = "wiring-does-not-import-routers"
name = "dependencies.py does not import the routers it wires"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["viva_api.dependencies"]
forbidden_modules = ["viva_api.api.routers"]

[tool.deptry]
exclude = [".venv/*", "home/*", "simulation_configs/*", "app/ui/explore_outputs.py", "knowledge/composites/dump_composites.py"]
ignore = ["DEP002", "DEP003", "DEP004", "DEP001"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true
extend-exclude = ["knowledge/"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # "DEP001",
#    # A001 Variable `sum` is shadowing a Python builtin
     "A001",
     "A002",
#    # B008 # Do not perform function call `Body` in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
     "B008",
#    # B026 Star-arg unpacking after a keyword argument is strongly discouraged
#    "B026",
     # B904 Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
     "B904",
#    # C414 Unnecessary `list` call within `tuple()`
     "C414",
#    # C416 Unnecessary `list` comprehension (rewrite using `list()`)
     "C416",
#    # C417 Unnecessary `map` usage (rewrite using a `list` comprehension)
     "C417",
#    # C419 Unnecessary list comprehension
     "C419",
#    # E501 Line too long (131 > 120)
     # "E501",
#    # E722 Do not use bare `except`
#    "E722",
#    # E731 Do not assign a `lambda` expression, use a `def`
#    "E731",
#    # F841 Local variable `keys` is assigned to but never used
#    "F841",
#    # PGH003 Use specific rule codes when ignoring type issues
#    "PGH003",
#    # RUF009 Do not perform function call `Field` in dataclass defaults
#    "RUF009",
    # RUF012 Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF012",
#    # RUF013 PEP 484 prohibits implicit `Optional
#    "RUF013",
#    # S101 Use of `assert` detected
#    "S101",
#    # *** S113 Probable use of `requests` call without timeout
#    "S113",
#    # S301 `pickle` and modules that wrap it can be unsafe when used to deserialize untrusted data, possible security issue
#    "S301",
#    # S307 Use of possibly insecure function
#    "S307",
#    # S603 `subprocess` call: check for execution of untrusted input
#    "S603",
#    # S608 Possible SQL injection vector through string-based query construction
#    "S608",
     # "S311",
#    # SIM101 Multiple `isinstance` calls for expression, merge into a single call
#    "SIM101",
#    # SIM105 Use `contextlib.suppress(KeyError)` instead of `try`-`except`-`pass`
#    "SIM105",
#    # SIM108 Use ternary operator `source = self.model_source.value if isinstance(self.model_source, ModelFilepath) else self.model_source` instead of `if`-`else`-block
#    "SIM108",
#    # SIM118 Use `key not in dict` instead of `key not in dict.keys()`
#    "SIM118",
    "S311",
    #  Standard pseudo-random generators are not suitable for cryptographic purposes
    # TRY002 Create your own exception
    "TRY002",
    # TRY003 Avoid specifying long messages outside the exception class
    "TRY003",
#    # TRY004 Prefer `TypeError` exception for invalid type
#    "TRY004",
    # TRY201 Use `raise` without specifying exception name
    "TRY201",
    # TRY300 Consider moving this statement to an `else` block
    "TRY300",
#    # TRY400 Use `logging.exception` instead of `logging.error`
#    "TRY400",
    # UP006 Use `dict` instead of `Dict` for type annotation
    "UP006",
#    # UP035 `typing.Dict` is deprecated, use `dict` instead
#    "UP035",
]
exclude = [".venv/*", "app/ui/*", "viva_api/api/client/*", "documentation/*", "home/*", "scratchpads/*", "simulation_configs/*", "notes/*"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["viva_api", "viva_core", "client"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"viva_api/simulation/simulation_service.py" = ["E501"]
"app/cli.py" = ["S603", "S607"]  # CLI subprocess calls are intentional
